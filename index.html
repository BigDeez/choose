  <style>
    /* Color Palette & Custom Theme Variables */
    :root {
      --bg: #07040a;               /* Deep dark background */
      --panel: #120818;            /* Glassmorphism panel fill */
      --panel-border: #2c1438;     /* Border glow color */
      --text: #f8f0fa;             /* Primary text color */
      --accent-gold: #f3c653;       /* Gold highlight color */
      --accent-rose: #ff2a6d;       /* Rose/Pink neon color */
      --font-main: 'Outfit', sans-serif;
      --font-serif: 'Playfair Display', serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow-x: hidden;
      padding: 1rem;
    }

    header { text-align: center; margin-top: 0.5rem; z-index: 10; }

    h1 {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #fff 20%, var(--accent-gold) 80%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: lowercase;
    }

    .sub-heading {
      color: #9a849f;
      font-size: 0.75rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 600;
    }

    /* 3D WebGL Canvas Containers */
    #webgl-container { position: fixed; inset: 0; z-index: 1; }
    #fx-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 95; }

    /* Welcome / Splash Screen */
    .start-screen {
      position: fixed;
      inset: 0;
      background: rgba(7, 4, 10, 0.96);
      backdrop-filter: blur(15px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 150;
      text-align: center;
      padding: 2rem;
    }

    .start-screen h2 {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 3rem;
      color: var(--accent-gold);
      margin-bottom: 0.5rem;
    }

    .start-screen p {
      color: #9a849f;
      font-size: 1.05rem;
      max-width: 450px;
      margin-bottom: 2rem;
      line-height: 1.5;
    }

    /* Heads Up Display (HUD) Controls */
    .hud-layer {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 650px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1rem;
      pointer-events: none;
    }

    .hud-layer > * { pointer-events: auto; }

    .control-panel {
      background: rgba(18, 8, 24, 0.85);
      backdrop-filter: blur(15px);
      border: 1px solid var(--panel-border);
      border-radius: 24px;
      padding: 1.5rem;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      text-align: center;
    }

    .instruction-text {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 1.4rem;
      color: var(--accent-gold);
      margin-bottom: 0.8rem;
    }

    /* Buttons Styling */
    .btn {
      background: linear-gradient(135deg, var(--accent-gold), #b38b25);
      color: #07040a;
      border: none;
      padding: 0.9rem 2.2rem;
      font-size: 1.05rem;
      font-weight: 800;
      border-radius: 14px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      box-shadow: 0 10px 25px rgba(243, 198, 83, 0.3);
      transition: all 0.25s ease;
    }

    .btn:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 15px 30px rgba(243, 198, 83, 0.5);
    }
    .btn:active { transform: translateY(1px) scale(0.98); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

    .btn-rose {
      background: linear-gradient(135deg, var(--accent-rose), #9e1441);
      color: #fff;
      box-shadow: 0 10px 25px rgba(255, 42, 109, 0.3);
    }
    .btn-rose:hover { box-shadow: 0 15px 30px rgba(255, 42, 109, 0.5); }

    /* Box Selection Grids */
    .box-choice-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.6rem;
      width: 100%;
      margin-top: 1rem;
    }

    .box-choice-btn {
      background: #190f1d;
      border: 2px solid var(--panel-border);
      border-radius: 14px;
      padding: 0.8rem 0.4rem;
      color: #fff;
      font-weight: 800;
      font-size: 0.75rem;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
    }

    .box-choice-btn:hover:not(:disabled) {
      border-color: var(--accent-gold);
      transform: translateY(-3px);
      box-shadow: 0 0 15px rgba(243, 198, 83, 0.4);
    }

    .box-choice-btn:disabled {
      opacity: 0.25;
      cursor: not-allowed;
      border-color: #190f1d;
    }

    /* Modal Windows & Reveals */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(7, 4, 10, 0.96);
      backdrop-filter: blur(15px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      z-index: 100;
    }

    .overlay.show { opacity: 1; pointer-events: auto; }

    .modal-card {
      background: var(--panel);
      border: 2px solid var(--accent-gold);
      padding: 2.2rem 1.8rem;
      border-radius: 28px;
      text-align: center;
      max-width: 560px;
      width: 90%;

      font-family: var(--font-serif);
      font-style: italic;

      font-weight: 800;

      20%, 80% { transform: translate3d(3px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-5px, 0, 0); }
      40%, 60% { transform: translate3d(5px, 0, 0); }

    =================================================================== */
    class SoundFX {
      constructor() {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      }
      playRoll() {
        if (this.ctx.state === 'suspended') this.ctx.resume();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(260, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.05);
        gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.05);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.05);
      }
      playExplode() {
        if (this.ctx.state === 'suspended') this.ctx.resume();
        [150, 300, 500, 800].forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.05);
          gain.gain.setValueAtTime(0.2, this.ctx.currentTime + idx * 0.05);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.05 + 0.35);
          osc.connect(gain);
          gain.connect(this.ctx.destination);

       SECTION 3D: ADVANCED "NEXUS D20" ORB DICE WITH GLOWING NUMBERS
    =================================================================== */

    diceGroup.position.set(0, 2.5, 2);

    // Dynamic Canvas Texture Generator for Floating Glowing Numbers (1 to 6)
    function createGlowNumberTexture(numberText) {
      const canvas = document.createElement('canvas');
      canvas.width = 512; 
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      // Dark Crystal Canvas Background
      ctx.fillStyle = '#0f0518';
      ctx.fillRect(0, 0, 512, 512);

      // Gold Geometric Border
      ctx.lineWidth = 16;
      ctx.strokeStyle = '#f3c653';
      ctx.strokeRect(20, 20, 472, 472);

      // Inner Glowing Number
      ctx.shadowColor = '#ff2a6d';
      ctx.shadowBlur = 30;
      ctx.fillStyle = '#ffffff';
      ctx.font = '900 280px Outfit, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(numberText.toString(), 256, 260);

      const texture = new THREE.CanvasTexture(canvas);
      texture.needsUpdate = true;
      return texture;

    let diceNumberMaterials = {};
    for (let i = 1; i <= 6; i++) {

      const geom = new THREE.TetrahedronGeometry(0.2);
      const mat = new THREE.MeshStandardMaterial({ color: mesh.userData.originalColor, roughness: 0.2, metalness: 0.8 });

      for (let i = 0; i < count; i++) {
        const shard = new THREE.Mesh(geom, mat);
        shard.position.copy(mesh.position);
        shard.userData = {
          vx: (Math.random() - 0.5) * 0.35,
          vy: Math.random() * 0.35 + 0.1,
          vz: (Math.random() - 0.5) * 0.35,
          rotX: Math.random() * 0.2,
          rotY: Math.random() * 0.2,
          life: 1.0
        };
        scene.add(shard);
        shards.push(shard);
      }
    }

    /* ==================================================================
       SECTION 3E: GAME STATE & CONTROLLER LOGIC
    =================================================================== */
    let currentRollValue = null;
    let placedCount = 0;
    let openedCount = 0;
    let masterBlueprint = [];
    let boxOutcomes = {};
    let isCelebSession = false;
    let finalCelebPick = null;

    const instructionText = document.getElementById('instructionText');
    const rollActionArea = document.getElementById('rollActionArea');
    const placeActionArea = document.getElementById('placeActionArea');
    const unsealActionArea = document.getElementById('unsealActionArea');
    const interactiveUnboxArea = document.getElementById('interactiveUnboxArea');
    const currentRollValEl = document.getElementById('currentRollVal');
    const boxChoiceGrid = document.getElementById('boxChoiceGrid');
    const unboxChoiceGrid = document.getElementById('unboxChoiceGrid');

    document.getElementById('initGameBtn').addEventListener('click', () => {
      document.getElementById('startScreen').style.display = 'none';
      instructionText.innerText = "Roll 1 of 5";
    });

    // Roll Orb Logic & Animation Ticker
    document.getElementById('rollDiceBtn').addEventListener('click', () => {
      document.getElementById('rollDiceBtn').disabled = true;
      instructionText.innerText = "Energizing Nexus D20...";

      let counter = 0;
      const rollInterval = setInterval(() => {
        sfx.playRoll();
        currentRollValue = Math.floor(Math.random() * 6) + 1;
        currentRollValEl.innerText = currentRollValue;

        // Dynamically update the 3D texture on the core d20 shape as it rolls
        d20Mesh.material = diceNumberMaterials[currentRollValue];

        diceGroup.rotation.x += 0.6;
        diceGroup.rotation.y += 0.8;
        ring1.rotation.z += 0.4;
        ring2.rotation.x += 0.5;
        diceGroup.position.y = 2.5 + Math.sin(counter) * 0.45;

        counter++;

        if (counter > 15) {
          clearInterval(rollInterval);
          diceGroup.position.y = 2.5;

          instructionText.innerText = `Rolled ${currentRollValue}! Choose destination box:`;
          rollActionArea.style.display = 'none';
          placeActionArea.style.display = 'block';
          renderBoxChoiceButtons();
        }
      }, 60);
    });

    function renderBoxChoiceButtons() {
      boxChoiceGrid.innerHTML = '';
      boxMeshes.forEach((mesh, idx) => {
        const btn = document.createElement('button');
        btn.className = 'box-choice-btn';
        const isFilled = mesh.userData.assignedValue !== null;
        btn.disabled = isFilled;
        btn.innerHTML = `<span>${mesh.userData.name}</span><span style="font-size:1rem; color:var(--accent-gold);">${isFilled ? '✓ Locked' : 'Empty'}</span>`;
        btn.onclick = () => assignRollToBox(idx);
        boxChoiceGrid.appendChild(btn);
      });
    }

    function assignRollToBox(boxIdx) {
      boxMeshes[boxIdx].userData.assignedValue = currentRollValue;
      placedCount++;

      boxMeshes[boxIdx].material.emissiveIntensity = 0.7;
      placeActionArea.style.display = 'none';

      if (placedCount < 5) {
        instructionText.innerText = `Roll ${placedCount + 1} of 5`;
        rollActionArea.style.display = 'block';
        document.getElementById('rollDiceBtn').disabled = false;
      } else {
        instructionText.innerText = "All Boxes Loaded! Ready to Unseal.";
        unsealActionArea.style.display = 'block';
      }
    }

    document.getElementById('unsealVaultBtn').addEventListener('click', () => {
      prepareOutcomes();
      unsealActionArea.style.display = 'none';
      instructionText.innerText = "She chooses which box to explode!";
      interactiveUnboxArea.style.display = 'block';
      renderUnboxChoiceButtons();
    });

    function prepareOutcomes() {
      const catVal = boxMeshes[0].userData.assignedValue;
      const targetValDice = boxMeshes[1].userData.assignedValue;
      const actionValDice = boxMeshes[2].userData.assignedValue;
      const methodValDice = boxMeshes[3].userData.assignedValue;
      const climaxValDice = boxMeshes[4].userData.assignedValue;

      const cat = poolData.categories[(catVal - 1) % poolData.categories.length];
      
      let targetPool = poolData.sub_her_body;
      let actPool = poolData.act_standard;
      isCelebSession = false;

      if (cat.includes("Clothing")) targetPool = poolData.sub_clothing;
      else if (cat.includes("Myself")) targetPool = poolData.sub_myself;
      else if (cat.includes("Celebrity")) { isCelebSession = true; actPool = poolData.act_celeb; }
      else if (cat.includes("Item")) targetPool = poolData.sub_item;

      let targetText = "";

      if (isCelebSession) {
        finalCelebPick = getRandomCeleb();
        targetText = `Celebrity / Fantasy Locked 🔒`;
      } else {
        targetText = targetPool[(targetValDice - 1) % targetPool.length];
      }

      if (cat.includes("Body Part")) {
        if (targetText === "Glasses" || targetText === "Mouth") actPool = poolData.act_glasses_mouth;
        else if (targetText === "Hands") actPool = poolData.act_hands;
      }

      const actionText = actPool[(actionValDice - 1) % actPool.length];
      const methodText = poolData.methods[(methodValDice - 1) % poolData.methods.length];
      const climaxText = poolData.climax[(climaxValDice - 1) % poolData.climax.length];

      masterBlueprint = [
        { title: "Stage 1: Category", val: cat, isCeleb: false },
        { title: "Stage 2: Target", val: targetText, isCeleb: isCelebSession },
        { title: "Stage 3: Action", val: actionText, isCeleb: false },
        { title: "Stage 4: Method", val: methodText, isCeleb: false },
        { title: "Stage 5: Over The Edge", val: climaxText, isCeleb: false }
      ];

      boxMeshes.forEach((mesh, i) => {
        boxOutcomes[i] = masterBlueprint[i];
      });
    }

    function renderUnboxChoiceButtons() {
      unboxChoiceGrid.innerHTML = '';
      boxMeshes.forEach((mesh, idx) => {
        const btn = document.createElement('button');
        btn.className = 'box-choice-btn';
        btn.disabled = mesh.userData.opened;
        btn.innerHTML = `<span>${mesh.name}</span><span style="font-size:0.9rem; color:var(--accent-gold);">${mesh.userData.opened ? 'Opened' : 'Explode 💥'}</span>`;
        btn.onclick = () => triggerBoxUnbox(idx);
        unboxChoiceGrid.appendChild(btn);
      });
    }

    let activeBoxIndex = null;
    function triggerBoxUnbox(boxIdx) {
      activeBoxIndex = boxIdx;
      boxMeshes[boxIdx].userData.opened = true;
      openedCount++;

      sfx.playExplode();
      triggerParticles();
      triggerShake();
      explodeBoxMesh(boxMeshes[boxIdx]);

      const stageData = boxOutcomes[boxIdx];
      const boxObj = boxMeshes[boxIdx];

      document.getElementById('modalTitle').innerText = `${boxObj.name} Box Unsealed (Rolled: ${boxObj.userData.assignedValue})`;
      const containerEl = document.getElementById('modalContentContainer');
      const celebGenBox = document.getElementById('celebGeneratorBox');

      celebGenBox.style.display = 'none';

      if (stageData.isCeleb) {
        containerEl.innerHTML = `
          <div style="font-size:1.1rem; color:var(--accent-gold); font-weight:800; margin-bottom:0.5rem;">Celebrity Fantasy Locked!</div>
          <div style="font-size:0.95rem; color:#9a849f; line-height:1.4;">The celebrity mystery identity will remain hidden until you press the generator at the end of the unsealing!</div>
        `;
      } else {
        containerEl.innerHTML = `<div class="modal-main-text">${stageData.val}</div>`;
      }

      const nextBtn = document.getElementById('modalNextBtn');
      if (openedCount < 5) {
        document.getElementById('blueprintBox').style.display = 'none';
        nextBtn.innerText = "Choose Next Box ➔";
      } else {
        const bpRows = document.getElementById('blueprintRows');
        bpRows.innerHTML = '';
        masterBlueprint.forEach((d, i) => {
          bpRows.innerHTML += `<div class="blueprint-row">${i + 1}. ${d.title}: <span id="bpRowVal${i}">${d.val}</span></div>`;
        });
        document.getElementById('blueprintBox').style.display = 'block';

        if (isCelebSession) {
          celebGenBox.style.display = 'block';
          nextBtn.innerText = "Start New Session ↺";
        } else {
          nextBtn.innerText = "Start New Session ↺";
        }
      }

      document.getElementById('revealOverlay').classList.add('show');
    }

    // End-Game Celebrity Generator Animation Ticker
    document.getElementById('spinCelebBtn').addEventListener('click', () => {
      const btn = document.getElementById('spinCelebBtn');
      btn.disabled = true;
      
      const slotCat = document.getElementById('slotCategory');
      const slotName = document.getElementById('slotName');

      let counter = 0;
      const maxTicks = 25;

      const ticker = setInterval(() => {
        sfx.playRoll();
        const rand = getRandomCeleb();
        slotCat.innerText = `📂 ${rand.category}`;
        slotName.innerText = rand.name;
        counter++;

        if (counter > maxTicks) {
          clearInterval(ticker);
          slotCat.innerText = `📂 ${finalCelebPick.category}`;
          slotName.innerText = finalCelebPick.name;
          
          sfx.playExplode();
          triggerParticles();
          triggerShake();

          const bpCelebRow = document.getElementById('bpRowVal1');
          if (bpCelebRow) {
            bpCelebRow.innerText = `${finalCelebPick.category} ➔ ${finalCelebPick.name}`;
          }

          btn.innerText = "Target Selected 🔥";
        }
      }, 50);
    });

    document.getElementById('modalNextBtn').addEventListener('click', () => {
      document.getElementById('revealOverlay').classList.remove('show');
      if (openedCount >= 5) {
        location.reload();
      } else {
        interactiveUnboxArea.style.display = 'block';
        renderUnboxChoiceButtons();
      }
    });

    function triggerShake() {
      const card = document.getElementById('modalCard');
      card.classList.add('shake');
      setTimeout(() => card.classList.remove('shake'), 400);
    }

    /* 2D Canvas Particle Effects Engine */
    const fxCanvas = document.getElementById('fx-canvas');
    const fxCtx = fxCanvas.getContext('2d');
    let particles = [];

    function resizeFx() { fxCanvas.width = window.innerWidth; fxCanvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeFx);
    resizeFx();

    function triggerParticles() {
      particles = [];
      const colors = ['#f3c653', '#ff2a6d', '#10b981', '#3b82f6', '#a855f7'];
      for (let i = 0; i < 110; i++) {
        particles.push({
          x: window.innerWidth / 2, y: window.innerHeight / 2,
          vx: (Math.random() - 0.5) * 22, vy: (Math.random() - 0.7) * 22,
          size: Math.random() * 9 + 4, color: colors[Math.floor(Math.random() * colors.length)], life: 1
        });
      }
      requestAnimationFrame(updateParticles);
    }

    function updateParticles() {
      fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
      particles.forEach(p => {
        p.x += p.vx; p.y += p.vy; p.vy += 0.35; p.life -= 0.015;
        fxCtx.fillStyle = p.color;
        fxCtx.globalAlpha = Math.max(p.life, 0);
        fxCtx.fillRect(p.x, p.y, p.size, p.size);
      });
      particles = particles.filter(p => p.life > 0);
      if (particles.length > 0) requestAnimationFrame(updateParticles);
    }

    /* ==================================================================
       SECTION 3F: REAL-TIME 60FPS THREE.JS RENDER LOOP
    =================================================================== */
    let clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const time = clock.getElapsedTime();

      // Floating animation for 3D boxes
      boxMeshes.forEach((mesh, i) => {
        if (mesh.visible) {
          mesh.position.y = -0.6 + Math.sin(time * 1.5 + i) * 0.12;
          mesh.rotation.y += 0.005;
        }
      });

      // Complex floating & multi-axis rotation for Nexus D20 Orb
      diceGroup.position.y = 2.5 + Math.sin(time * 2) * 0.18;
      diceGroup.rotation.y += 0.012;
      d20Mesh.rotation.x += 0.01;
      d20Mesh.rotation.z += 0.008;

      ring1.rotation.x += 0.02;
      ring1.rotation.y += 0.015;
      ring2.rotation.y -= 0.025;
      ring2.rotation.z += 0.01;

      // Pulse shell brightness
      shellMat.emissiveIntensity = 0.3 + Math.sin(time * 3) * 0.2;

      // Exploding shard physics animation
      shards.forEach((s, idx) => {
        s.position.x += s.userData.vx;
        s.position.y += s.userData.vy;
        s.position.z += s.userData.vz;
        s.userData.vy -= 0.015;
        s.rotation.x += s.userData.rotX;
        s.rotation.y += s.userData.rotY;
        s.userData.life -= 0.02;
        s.scale.setScalar(Math.max(s.userData.life, 0.001));
        if (s.userData.life <= 0) {
          scene.remove(s);
          shards.splice(idx, 1);
        }
      });

      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
