<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Night Engine - Coaster Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0d14;
      --panel: #161a26;
      --panel-border: #2e354f;
      --text: #ffffff;
      --accent-gold: #ffbe0b;
      --accent-pink: #ff007f;
      --accent-purple: #8338ec;
      --accent-blue: #3a86ef;
      --font-main: 'Outfit', -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(131, 56, 236, 0.25) 0%, transparent 60%),
        radial-gradient(circle at 50% 100%, rgba(255, 0, 127, 0.2) 0%, transparent 60%);
      color: var(--text);
      font-family: var(--font-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 1.5rem 1rem;
      overflow-x: hidden;
    }

    header { text-align: center; margin-bottom: 1.2rem; }

    h1 {
      font-size: 2.8rem;
      font-weight: 900;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #fff 10%, var(--accent-pink) 60%, var(--accent-gold) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 25px rgba(255, 0, 127, 0.4);
    }

    .sub-heading {
      color: #94a3b8;
      font-size: 0.95rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 800;
      margin-top: 0.2rem;
    }

    .stage-indicator {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .badge {
      padding: 0.5rem 1rem;
      border-radius: 999px;
      font-weight: 800;
      font-size: 0.8rem;
      letter-spacing: 1px;
      background: var(--panel);
      border: 2px solid var(--panel-border);
      color: #64748b;
      transition: all 0.3s ease;
    }

    .badge.active {
      border-color: var(--accent-pink);
      color: #ffffff;
      box-shadow: 0 0 20px rgba(255, 0, 127, 0.5);
      transform: scale(1.08);
    }

    .badge.completed {
      border-color: var(--accent-gold);
      color: var(--accent-gold);
    }

    .main-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
      width: 100%;
      max-width: 1000px;
    }

    .wheel-card {
      position: relative;
      background: var(--panel);
      border: 2px solid var(--panel-border);
      border-radius: 28px;
      padding: 1.8rem 1.2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      width: 100%;
      max-width: 520px;
    }

    .wheel-card h2 {
      font-size: 1.8rem;
      font-weight: 900;
      color: var(--accent-pink);
      text-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
    }

    .wheel-wrapper {
      position: relative;
      width: 380px;
      height: 380px;
      margin: 1.2rem 0;
    }

    .pointer {
      position: absolute;
      top: 50%;
      right: -24px;
      transform: translateY(-50%);
      width: 0;
      height: 0;
      border-top: 20px solid transparent;
      border-bottom: 20px solid transparent;
      border-right: 36px solid var(--accent-gold);
      z-index: 10;
      filter: drop-shadow(0 0 12px var(--accent-gold));
      transition: transform 0.1s ease;
    }

    .pointer.bounce { transform: translateY(-50%) translateX(6px) scale(1.15); }

    canvas#wheelCanvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.9);
    }

    .controls { display: flex; gap: 1rem; width: 100%; justify-content: center; }

    .btn {
      background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
      color: white;
      border: none;
      padding: 1rem 2.2rem;
      font-size: 1.2rem;
      font-weight: 900;
      border-radius: 16px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      box-shadow: 0 10px 30px rgba(255, 0, 127, 0.4);
      transition: all 0.25s ease;
    }

    .btn:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 15px 35px rgba(255, 0, 127, 0.6);
    }
    .btn:active { transform: translateY(1px) scale(0.98); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

    .btn-secondary {
      background: transparent;
      border: 2px solid var(--panel-border);
      color: #94a3b8;
      box-shadow: none;
    }
    .btn-secondary:hover { background: var(--panel-border); color: #fff; box-shadow: none; }

    .editor-section {
      width: 100%;
      max-width: 520px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 20px;
      padding: 1.1rem;
    }

    .editor-section h3 {
      font-size: 0.85rem;
      margin-bottom: 0.6rem;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .editor-inputs { display: flex; gap: 0.5rem; margin-bottom: 0.6rem; }

    input[type="text"] {
      flex: 1;
      background: #0b0d14;
      border: 1px solid var(--panel-border);
      padding: 0.6rem 0.9rem;
      border-radius: 10px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
    }
    input[type="text"]:focus { outline: none; border-color: var(--accent-pink); }

    .tags-container {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      max-height: 90px;
      overflow-y: auto;
    }

    .tag {
      background: #242b3d;
      padding: 0.3rem 0.7rem;
      border-radius: 8px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: #ffffff;
    }

    .tag-remove { cursor: pointer; color: var(--accent-pink); font-weight: bold; }

    /* Overlay Result Modal */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(11, 13, 20, 0.92);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      z-index: 100;
    }

    .overlay.show { opacity: 1; pointer-events: auto; }

    .result-card {
      background: var(--panel);
      border: 2px solid var(--accent-gold);
      padding: 2.5rem 1.8rem;
      border-radius: 28px;
      text-align: center;
      max-width: 500px;
      width: 90%;
      transform: scale(0.8);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 0 60px rgba(255, 190, 11, 0.3);
    }

    .overlay.show .result-card { transform: scale(1); }
    .result-title { font-size: 1rem; color: var(--accent-gold); text-transform: uppercase; letter-spacing: 2px; font-weight: 800; }
    
    .result-main {
      font-size: 2.4rem;
      font-weight: 900;
      color: #fff;
      margin: 1rem 0;
      line-height: 1.2;
      text-shadow: 0 0 15px rgba(255, 0, 127, 0.5);
    }

    .result-sequence-list {
      margin-top: 1.2rem;
      text-align: left;
      background: #0b0d14;
      padding: 1.2rem;
      border-radius: 16px;
      border: 1px dashed var(--accent-pink);
    }

    .result-seq-item { font-size: 1rem; margin-bottom: 0.5rem; color: #cbd5e1; }
    .result-seq-item span { color: var(--accent-gold); font-weight: 800; }

    /* Coaster Animation Screen */
    #coasterOverlay {
      position: fixed;
      inset: 0;
      background: #0b0d14;
      z-index: 200;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    #coasterOverlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    #coasterCanvas {
      width: 100%;
      max-width: 800px;
      height: 300px;
    }

    .coaster-title {
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--accent-gold);
      margin-top: 1rem;
      text-transform: uppercase;
    }

    .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
    @keyframes shake {
      10%, 90% { transform: translate3d(-1px, 0, 0); }
      20%, 80% { transform: translate3d(2px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
      40%, 60% { transform: translate3d(4px, 0, 0); }
    }

    #fx-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 90; }
  </style>
</head>

  <script>
    class SoundFX {
      constructor() {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      }
      playTick() {
        if (this.ctx.state === 'suspended') this.ctx.resume();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(500, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.04);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.04);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.04);
      }
      playWin() {
        if (this.ctx.state === 'suspended') this.ctx.resume();
        const notes = [261.63, 329.63, 392.00, 523.25];
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.08);
          gain.gain.setValueAtTime(0, this.ctx.currentTime + idx * 0.08);
          gain.gain.linearRampToValueAtTime(0.2, this.ctx.currentTime + idx * 0.08 + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.08 + 0.4);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(this.ctx.currentTime + idx * 0.08);
          osc.stop(this.ctx.currentTime + idx * 0.08 + 0.4);
        });
      }
    }

    const sfx = new SoundFX();

    const masterData = {
      category: {

        defaultOpts: ["Bra", "Knickers", "Skirt", "Shirt", "Hijab", "Dress", "Heels", "Jeans", "Gloves", "Stockings"],
        opts: []
      },
      act_clothing: {

        badgeId: "badge-action",
        defaultOpts: ["Leave it", "Clean it", "Taste it", "Share it", "Play with it", "Take pictures"],
        opts: []
      },
      sub_myself: {
        title: "Target: My Body Part",
        badgeId: "badge-target",
        defaultOpts: ["Stomach", "Balls", "Chest", "Hand", "Face", "Feet"],
        opts: []
      },
      act_myself: {
        title: "Action: What she does",
        badgeId: "badge-action",
        defaultOpts: ["Taste it", "Share it", "Play with it", "Use as lube", "Clean it up"],
        opts: []
      },
      sub_celeb: {
        title: "Target: UK Female Celebrity",
        badgeId: "badge-target",
        defaultOpts: ["Holly Willoughby", "Maya Jama", "Kelly Brook", "Amanda Holden", "Michelle Keegan", "Rita Ora", "Florence Pugh", "Gemma Atkinson"],
        opts: []
      },

        title: "Rule: Blindfold & Snap",
        badgeId: "badge-action",

        opts: []
      },
      sub_item: {
        title: "Target: Naughty Item / Prop",
        badgeId: "badge-target",
        defaultOpts: ["Waffle Blanket", "Kitchen Counter", "Mirror", "Sofa Cushion", "Car Bonnet", "Chair", "Phone Screen"],
        opts: []
      },
      act_item: {
        title: "Action: What to do",
        badgeId: "badge-action",
        defaultOpts: ["Take pics", "Play with it", "Lick it off"],
        opts: []
      },
      method: {
        title: "Stage 4: Method / Technique",
        badgeId: "badge-method",
        defaultOpts: ["Blowjob", "Hand job", "Paired (Hand & Mouth)", "Pick a Hand Technique", "Slow vs Speed", "Toy Assisted"],
        opts: []
      },
      climax: {
        title: "Stage 5: Over The Edge",
        badgeId: "badge-climax",
        defaultOpts: [
          "She's trying to break it off",
          "No stopping till every drop is out",
          "Edge 3 times before release",
          "Ruined hands off",
          "Slow motion only",
          "Denial trap (30s pause)",
          "Mrs takes control",
          "Cock and ball torture"
        ],
        opts: []
      }
    };

    Object.keys(masterData).forEach(k => {
      masterData[k].opts = [...masterData[k].defaultOpts];
    });

    let activeSequenceKeys = ["category", "sub_her_body", "act_standard_body", "method", "climax"];
    let currentStepIndex = 0;
    let selections = {};

    // Vibrant Distinct Wheel Slice Colors
    const colors = [
      '#ff007f', '#8338ec', '#3a86ef', '#00f5d4', 
      '#ffbe0b', '#fb5607', '#ff0054', '#70e000'
    ];

    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    let currentAngle = 0;
    let isSpinning = false;

    function getCurrentKey() {
      return activeSequenceKeys[currentStepIndex];
    }

    function drawWheel() {
      const key = getCurrentKey();
      const options = masterData[key].opts;
      const numSlices = options.length;
      const sliceAngle = (2 * Math.PI) / numSlices;
      const radius = canvas.width / 2;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (numSlices === 0) {
        ctx.fillStyle = '#161a26';
        ctx.beginPath();
        ctx.arc(radius, radius, radius, 0, 2 * Math.PI);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 28px Outfit';
        ctx.textAlign = 'center';
        ctx.fillText('Add Options Below', radius, radius);
        return;
      }

      options.forEach((opt, idx) => {
        const start = currentAngle + (idx * sliceAngle);
        const end = start + sliceAngle;

        ctx.beginPath();
        ctx.moveTo(radius, radius);
        ctx.arc(radius, radius, radius - 12, start, end);
        ctx.closePath();
        ctx.fillStyle = colors[idx % colors.length];
        ctx.fill();
        ctx.lineWidth = 5;
        ctx.strokeStyle = '#0b0d14';
        ctx.stroke();

        ctx.save();
        ctx.translate(radius, radius);
        ctx.rotate(start + sliceAngle / 2);
        ctx.textAlign = 'right';
        ctx.fillStyle = '#ffffff';

        // High readability font sizes
        let fontSize = 28;
        if (numSlices > 8) fontSize = 22;
        if (opt.length > 25) fontSize = 18;
        else if (opt.length > 18) fontSize = 22;

        ctx.font = `900 ${fontSize}px Outfit, sans-serif`;
        ctx.shadowColor = 'rgba(0, 0, 0, 0.9)';
        ctx.shadowBlur = 10;
        ctx.fillText(opt, radius - 35, fontSize / 3.2);
        ctx.restore();
      });

      // Central Hub
      ctx.beginPath();
      ctx.arc(radius, radius, 48, 0, 2 * Math.PI);
      ctx.fillStyle = '#0b0d14';
      ctx.fill();
      ctx.lineWidth = 5;
      ctx.strokeStyle = '#ffbe0b';
      ctx.stroke();
    }

    const pointer = document.getElementById('pointer');
    let lastSegmentIndex = -1;

    function spinWheel() {
      const key = getCurrentKey();
      const options = masterData[key].opts;
      if (isSpinning || options.length === 0) return;

      isSpinning = true;
      document.getElementById('spinBtn').disabled = true;

      const numSlices = options.length;
      const sliceAngle = (2 * Math.PI) / numSlices;
      const extraRounds = 5 + Math.floor(Math.random() * 4);
      const randomSliceIndex = Math.floor(Math.random() * numSlices);
      
      const pointerAngle = 0; // 3 o'clock
      const targetSliceMid = randomSliceIndex * sliceAngle + sliceAngle / 2;
      const totalRotation = (extraRounds * 2 * Math.PI) + (pointerAngle - targetSliceMid) - (currentAngle % (2 * Math.PI));

      const duration = 4500;
      const startAngle = currentAngle;
      const startTime = performance.now();

      function animateSpin(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const easeOut = 1 - Math.pow(1 - progress, 3);
        currentAngle = startAngle + totalRotation * easeOut;

        const normalizedAngle = (0 - currentAngle) % (2 * Math.PI);
        const positiveAngle = (normalizedAngle + 2 * Math.PI) % (2 * Math.PI);
        const currentSegment = Math.floor(positiveAngle / sliceAngle) % numSlices;

        if (currentSegment !== lastSegmentIndex) {
          sfx.playTick();
          pointer.classList.add('bounce');
          setTimeout(() => pointer.classList.remove('bounce'), 50);
          lastSegmentIndex = currentSegment;
        }

        drawWheel();

        if (progress < 1) {
          requestAnimationFrame(animateSpin);
        } else {
          isSpinning = false;
          document.getElementById('spinBtn').disabled = false;
          handleWin(options[randomSliceIndex]);
        }
      }

      requestAnimationFrame(animateSpin);
    }

    function handleWin(resultText) {
      sfx.playWin();
      triggerScreenShake();
      triggerParticles();

      const key = getCurrentKey();
      selections[key] = resultText;

      if (key === 'category') {
        if (resultText.includes("Body Part")) {
          activeSequenceKeys = ["category", "sub_her_body", "act_standard_body", "method", "climax"];
        } else if (resultText.includes("Clothing")) {
          activeSequenceKeys = ["category", "sub_clothing", "act_clothing", "method", "climax"];
        } else if (resultText.includes("Myself")) {
          activeSequenceKeys = ["category", "sub_myself", "act_myself", "method", "climax"];
        } else if (resultText.includes("Celebrity")) {
          activeSequenceKeys = ["category", "sub_celeb", "act_celeb", "method", "climax"];
        } else if (resultText.includes("Item")) {
          activeSequenceKeys = ["category", "sub_item", "act_item", "method", "climax"];
        }
      } else if (key === 'sub_her_body') {
        if (resultText === "Hair") {
          activeSequenceKeys = ["category", "sub_her_body", "method", "climax"];
        } else if (resultText === "Glasses" || resultText === "Mouth") {
          activeSequenceKeys = ["category", "sub_her_body", "act_glasses_mouth", "method", "climax"];
        } else if (resultText === "Hands") {
          activeSequenceKeys = ["category", "sub_her_body", "act_her_hands", "method", "climax"];
        } else {
          activeSequenceKeys = ["category", "sub_her_body", "act_standard_body", "method", "climax"];
        }
      }

      const overlay = document.getElementById('resultOverlay');
      const resTitle = document.getElementById('resTitle');
      const resText = document.getElementById('resText');
      const nextBtn = document.getElementById('nextStageBtn');
      const seqBox = document.getElementById('resSequenceBox');

      resTitle.innerText = `${masterData[key].title} Locked`;
      resText.innerText = resultText;

      if (currentStepIndex < activeSequenceKeys.length - 1) {
        seqBox.style.display = 'none';
        nextBtn.innerText = "Ride to Next Wheel →";
      } else {
        const seqContent = document.getElementById('resSequenceContent');
        let html = `<div class="result-seq-item">1. Category: <span>${selections['category']}</span></div>`;
        
        activeSequenceKeys.forEach((k, idx) => {
          if (idx > 0) {
            html += `<div class="result-seq-item">${idx + 1}. ${masterData[k].title}: <span>${selections[k]}</span></div>`;
          }
        });

        seqContent.innerHTML = html;
        seqBox.style.display = 'block';
        nextBtn.innerText = "Start New Run ↺";
      }

      overlay.classList.add('show');
    }

    // Coaster Transition Animation Engine
    function startCoasterAnimation(callback) {
      const coasterOverlay = document.getElementById('coasterOverlay');
      const coasterCanvas = document.getElementById('coasterCanvas');
      const cctx = coasterCanvas.getContext('2d');
      const coasterText = document.getElementById('coasterText');

      coasterText.innerText = `Riding to Stage ${currentStepIndex + 1}...`;
      coasterOverlay.classList.add('active');

      let startTime = performance.now();
      const duration = 1800; // ms

      function animateCoaster(now) {
        const elapsed = now - startTime;
        const p = Math.min(elapsed / duration, 1);

        cctx.clearRect(0, 0, coasterCanvas.width, coasterCanvas.height);

        // Draw Roller Coaster Track (Sine Wave)
        cctx.beginPath();
        cctx.lineWidth = 8;
        cctx.strokeStyle = '#3a86ef';
        for (let x = 0; x <= coasterCanvas.width; x += 10) {
          let y = 150 + Math.sin(x * 0.015) * 60;
          if (x === 0) cctx.moveTo(x, y);
          else cctx.lineTo(x, y);
        }
        cctx.stroke();

        // Cart Position Along Sine Wave
        let cartX = p * coasterCanvas.width;
        let cartY = 150 + Math.sin(cartX * 0.015) * 60;
        let slope = Math.cos(cartX * 0.015) * 60 * 0.015;
        let angle = Math.atan(slope);

        // Draw Cartoon Cart
        cctx.save();
        cctx.translate(cartX, cartY);
        cctx.rotate(angle);

        // Cart Body
        cctx.fillStyle = '#ff007f';
        cctx.fillRect(-25, -20, 50, 25);

        // Wheels
        cctx.fillStyle = '#ffbe0b';
        cctx.beginPath();
        cctx.arc(-15, 8, 7, 0, 2 * Math.PI);
        cctx.arc(15, 8, 7, 0, 2 * Math.PI);
        cctx.fill();

        // Stick Figure Passenger
        cctx.strokeStyle = '#ffffff';
        cctx.lineWidth = 3;
        cctx.beginPath();
        cctx.arc(0, -32, 6, 0, 2 * Math.PI); // Head
        cctx.moveTo(0, -26); cctx.lineTo(0, -15); // Spine
        cctx.moveTo(0, -20); cctx.lineTo(-12, -30); // Raised arm
        cctx.moveTo(0, -20); cctx.lineTo(12, -30);  // Raised arm
        cctx.stroke();

        cctx.restore();

        if (p < 1) {
          requestAnimationFrame(animateCoaster);
        } else {
          coasterOverlay.classList.remove('active');
          callback();
        }
      }

      requestAnimationFrame(animateCoaster);
    }

    function triggerScreenShake() {
      document.getElementById('wheel-card').classList.add('shake');
      setTimeout(() => document.getElementById('wheel-card').classList.remove('shake'), 500);
    }

    const fxCanvas = document.getElementById('fx-canvas');
    const fxCtx = fxCanvas.getContext('2d');
    let particles = [];

    function resizeFx() { fxCanvas.width = window.innerWidth; fxCanvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeFx);
    resizeFx();

    function triggerParticles() {
      particles = [];
      for (let i = 0; i < 90; i++) {
        particles.push({
          x: window.innerWidth / 2, y: window.innerHeight / 2,
          vx: (Math.random() - 0.5) * 16, vy: (Math.random() - 0.7) * 16,
          size: Math.random() * 8 + 4, color: colors[Math.floor(Math.random() * colors.length)], life: 1
        });
      }
      requestAnimationFrame(updateParticles);
    }

    function updateParticles() {
      fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
      particles.forEach(p => {
        p.x += p.vx; p.y += p.vy; p.vy += 0.3; p.life -= 0.015;
        fxCtx.fillStyle = p.color;
        fxCtx.globalAlpha = Math.max(p.life, 0);
        fxCtx.fillRect(p.x, p.y, p.size, p.size);
      });
      particles = particles.filter(p => p.life > 0);
      if (particles.length > 0) requestAnimationFrame(updateParticles);
    }

    function updateUI() {
      const key = getCurrentKey();
      const data = masterData[key];
      
      document.getElementById('stage-title').innerText = data.title;
      document.getElementById('editor-title').innerText = `Edit ${data.title}`;

      const badgeIds = ["badge-category", "badge-target", "badge-action", "badge-method", "badge-climax"];
      badgeIds.forEach((bId, idx) => {
        const badge = document.getElementById(bId);
        if (idx < currentStepIndex) badge.className = "badge completed";
        else if (idx === currentStepIndex) badge.className = "badge active";
        else badge.className = "badge";
      });

      renderTags();
      drawWheel();
    }

    function renderTags() {
      const key = getCurrentKey();
      const container = document.getElementById('tagsContainer');
      container.innerHTML = '';
      masterData[key].opts.forEach((opt, idx) => {
        const tag = document.createElement('div');
        tag.className = 'tag';
        tag.innerHTML = `<span>${opt}</span><span class="tag-remove" onclick="removeOption(${idx})">&times;</span>`;
        container.appendChild(tag);
      });
    }

    function removeOption(idx) {
      const key = getCurrentKey();
      masterData[key].opts.splice(idx, 1);
      renderTags();
      drawWheel();
    }

    document.getElementById('addOptionBtn').addEventListener('click', () => {
      const input = document.getElementById('optionInput');
      const val = input.value.trim();
      if (!val) return;
      const key = getCurrentKey();
      masterData[key].opts.push(val);
      input.value = '';
      renderTags();
      drawWheel();
    });

    document.getElementById('resetDefaultsBtn').addEventListener('click', () => {
      const key = getCurrentKey();
      masterData[key].opts = [...masterData[key].defaultOpts];
      renderTags();
      drawWheel();
    });

    document.getElementById('spinBtn').addEventListener('click', spinWheel);

    document.getElementById('nextStageBtn').addEventListener('click', () => {
      document.getElementById('resultOverlay').classList.remove('show');
      
      if (currentStepIndex < activeSequenceKeys.length - 1) {
        startCoasterAnimation(() => {
          currentStepIndex++;
          updateUI();
        });
      } else {
        currentStepIndex = 0;
        activeSequenceKeys = ["category", "sub_her_body", "act_standard_body", "method", "climax"];
        selections = {};
        updateUI();
      }
    });

    updateUI();
  </script>
</body>
</html>
