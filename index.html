<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ultimate Decision Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d0f17;
      --panel: #161926;
      --panel-border: #2a2f45;
      --text: #f0f3fe;
      --accent-1: #ff2a85;
      --accent-2: #00f0ff;
      --accent-3: #ffe600;
      --accent-4: #a855f7;
      --font-main: 'Outfit', system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 2rem 1rem;
      overflow-x: hidden;
    }

    header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 900;
      letter-spacing: 1px;
      background: linear-gradient(135deg, var(--accent-2), var(--accent-1));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      text-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
    }

    .sub-heading {
      color: #8a94b8;
      font-size: 1.1rem;
      margin-top: 0.3rem;
    }

    .stage-indicator {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .badge {
      padding: 0.5rem 1.2rem;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.9rem;
      background: var(--panel);
      border: 2px solid var(--panel-border);
      color: #64748b;
      transition: all 0.3s ease;
    }

    .badge.active {
      border-color: var(--accent-2);
      color: var(--text);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
      transform: scale(1.05);
    }

    .badge.completed {
      border-color: var(--accent-3);
      color: var(--accent-3);
    }

    .main-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      width: 100%;
      max-width: 1000px;
    }

    .wheel-card {
      position: relative;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 24px;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      width: 100%;
      max-width: 500px;
    }

    .wheel-wrapper {
      position: relative;
      width: 340px;
      height: 340px;
      margin: 1.5rem 0;
    }

    .pointer {
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 18px solid transparent;
      border-right: 18px solid transparent;
      border-top: 32px solid var(--accent-1);
      z-index: 10;
      filter: drop-shadow(0 0 10px var(--accent-1));
      transition: transform 0.1s ease;
    }

    .pointer.bounce {
      transform: translateX(-50%) translateY(-5px) scale(1.1);
    }

    canvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), 0 0 15px rgba(255, 255, 255, 0.05);
    }

    .controls {
      display: flex;
      gap: 1rem;
      width: 100%;
      justify-content: center;
    }

    .btn {
      background: linear-gradient(135deg, var(--accent-1), #d9005b);
      color: white;
      border: none;
      padding: 1rem 2.5rem;
      font-size: 1.2rem;
      font-weight: 800;
      border-radius: 14px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 10px 25px rgba(255, 42, 133, 0.4);
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .btn:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 15px 30px rgba(255, 42, 133, 0.6);
    }

    .btn:active {
      transform: translateY(1px) scale(0.98);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .btn-secondary {
      background: transparent;
      border: 2px solid var(--panel-border);
      color: var(--text);
      box-shadow: none;
    }

    .btn-secondary:hover {
      background: var(--panel-border);
      box-shadow: none;
    }

    /* Input Editors */
    .editor-section {
      width: 100%;
      max-width: 500px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      padding: 1.2rem;
      margin-top: 1rem;
    }

    .editor-section h3 {
      font-size: 1rem;
      margin-bottom: 0.8rem;
      color: #a0aec0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .editor-inputs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.8rem;
    }

    input[type="text"] {
      flex: 1;
      background: #0d0f17;
      border: 1px solid var(--panel-border);
      padding: 0.6rem 1rem;
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--accent-2);
    }

    .tags-container {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      max-height: 120px;
      overflow-y: auto;
    }

    .tag {
      background: #222738;
      padding: 0.3rem 0.8rem;
      border-radius: 8px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .tag-remove {
      cursor: pointer;
      color: #ef4444;
      font-weight: bold;
    }

    /* Modal / Result overlay */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(13, 15, 23, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      z-index: 100;
    }

    .overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .result-card {
      background: var(--panel);
      border: 2px solid var(--accent-2);
      padding: 3rem 2rem;
      border-radius: 24px;
      text-align: center;
      max-width: 480px;
      width: 90%;
      transform: scale(0.8);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 0 50px rgba(0, 240, 255, 0.3);
    }

    .overlay.show .result-card {
      transform: scale(1);
    }

    .result-title {
      font-size: 1.2rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .result-main {
      font-size: 2.4rem;
      font-weight: 900;
      color: #fff;
      margin: 1rem 0;
      line-height: 1.2;
    }

    .result-combined {
      margin-top: 1.5rem;
      padding: 1rem;
      background: #0d0f17;
      border-radius: 12px;
      border: 1px dashed var(--accent-3);
    }

    .result-combined-title {
      font-size: 0.85rem;
      color: var(--accent-3);
      text-transform: uppercase;
    }

    .result-combined-text {
      font-size: 1.3rem;
      font-weight: 700;
      margin-top: 0.3rem;
    }

    /* Screen shake effect */
    .shake {
      animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
    }

    @keyframes shake {
      10%, 90% { transform: translate3d(-1px, 0, 0); }
      20%, 80% { transform: translate3d(2px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
      40%, 60% { transform: translate3d(4px, 0, 0); }
    }

    /* Confetti Canvas */
    #fx-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 90;
    }
  </style>
</head>
<body>

  <canvas id="fx-canvas"></canvas>

  <header>
    <h1>Decision Engine</h1>
    <p class="sub-heading">Stage 1: Choose What $\rightarrow$ Stage 2: Decide How</p>
  </header>

  <div class="stage-indicator">
    <div id="badge-1" class="badge active">1. WHAT</div>
    <div id="badge-2" class="badge">2. HOW</div>
  </div>

  <main class="main-container">
    <div class="wheel-card" id="wheel-card">
      <h2 id="stage-title" style="color: var(--accent-2);">Stage 1: Select Choice</h2>
      <div class="wheel-wrapper">
        <div class="pointer" id="pointer"></div>
        <canvas id="wheelCanvas" width="600" height="600"></canvas>
      </div>
      <div class="controls">
        <button class="btn" id="spinBtn">SPIN WHEEL</button>
      </div>
    </div>

    <!-- Editor Controls -->
    <div class="editor-section">
      <h3>
        <span id="editor-title">Edit Stage 1 Options</span>
        <button class="btn btn-secondary" id="resetDefaultsBtn" style="padding: 0.3rem 0.8rem; font-size: 0.8rem;">Reset</button>
      </h3>
      <div class="editor-inputs">
        <input type="text" id="optionInput" placeholder="Add custom option...">
        <button class="btn" id="addOptionBtn" style="padding: 0.6rem 1.2rem; font-size: 0.9rem;">Add</button>
      </div>
      <div class="tags-container" id="tagsContainer"></div>
    </div>
  </main>

  <!-- Result Modal Overlay -->
  <div class="overlay" id="resultOverlay">
    <div class="result-card">
      <div class="result-title" id="resTitle">Stage 1 Result</div>
      <div class="result-main" id="resText">OPTION</div>
      <div class="result-combined" id="resCombinedBox" style="display: none;">
        <div class="result-combined-title">Final Decision Output</div>
        <div class="result-combined-text" id="resCombinedText">---</div>
      </div>
      <div style="margin-top: 2rem; display: flex; gap: 1rem; justify-content: center;">
        <button class="btn" id="nextStageBtn">Proceed to Stage 2 $\rightarrow$</button>
      </div>
    </div>
  </div>

  <script>
    // --- AUDIO SYNTHESIZER (Web Audio API) ---
    class SoundFX {
      constructor() {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      }

      playTick() {
        if (this.ctx.state === 'suspended') this.ctx.resume();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(400, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(80, this.ctx.currentTime + 0.04);
        gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.04);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.04);
      }

      playWin() {
        if (this.ctx.state === 'suspended') this.ctx.resume();
        const notes = [261.63, 329.63, 392.00, 523.25];
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.08);
          gain.gain.setValueAtTime(0, this.ctx.currentTime + idx * 0.08);
          gain.gain.linearRampToValueAtTime(0.2, this.ctx.currentTime + idx * 0.08 + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.08 + 0.4);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(this.ctx.currentTime + idx * 0.08);
          osc.stop(this.ctx.currentTime + idx * 0.08 + 0.4);
        });
      }
    }

    const sfx = new SoundFX();

    // --- STATE MANAGEMENT ---
    const defaultStage1 = ["Take a Break", "Deep Work Session", "Quick Clean Up", "Go for Walk", "Learn Something", "Creative Hobby"];
    const defaultStage2 = ["With 25m Timer", "Listen to Synthwave", "With a Cold Drink", "At Double Speed", "Very Slowly", "While Audiobooking"];

    let currentStage = 1;
    let stage1Options = [...defaultStage1];
    let stage2Options = [...defaultStage2];
    let stage1Result = "";
    let stage2Result = "";

    const colors = [
      '#ff2a85', '#00f0ff', '#ffe600', '#a855f7', 
      '#10b981', '#f97316', '#3b82f6', '#ec4899'
    ];

    // --- CANVAS WHEEL ENGINE ---
    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    let currentAngle = 0;
    let isSpinning = false;

    function drawWheel() {
      const options = currentStage === 1 ? stage1Options : stage2Options;
      const numSlices = options.length;
      const sliceAngle = (2 * Math.PI) / numSlices;
      const radius = canvas.width / 2;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (numSlices === 0) {
        ctx.fillStyle = '#1e293b';
        ctx.beginPath();
        ctx.arc(radius, radius, radius, 0, 2 * Math.PI);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 24px Outfit';
        ctx.textAlign = 'center';
        ctx.fillText('Add Options Below', radius, radius);
        return;
      }

      options.forEach((opt, idx) => {
        const start = currentAngle + idx * sliceAngle;
        const end = start + sliceAngle;

        // Draw Slice
        ctx.beginPath();
        ctx.moveTo(radius, radius);
        ctx.arc(radius, radius, radius - 10, start, end);
        ctx.closePath();
        ctx.fillStyle = colors[idx % colors.length];
        ctx.fill();
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#0d0f17';
        ctx.stroke();

        // Slice Text
        ctx.save();
        ctx.translate(radius, radius);
        ctx.rotate(start + sliceAngle / 2);
        ctx.textAlign = 'right';
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 22px Outfit';
        ctx.shadowColor = 'rgba(0,0,0,0.6)';
        ctx.shadowBlur = 6;
        ctx.fillText(opt, radius - 35, 8);
        ctx.restore();
      });

      // Inner Hub
      ctx.beginPath();
      ctx.arc(radius, radius, 45, 0, 2 * Math.PI);
      ctx.fillStyle = '#0d0f17';
      ctx.fill();
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#2a2f45';
      ctx.stroke();
    }

    // --- SPIN LOGIC & PHYSICS ---
    const pointer = document.getElementById('pointer');
    let lastSegmentIndex = -1;

    function spinWheel() {
      const options = currentStage === 1 ? stage1Options : stage2Options;
      if (isSpinning || options.length === 0) return;

      isSpinning = true;
      document.getElementById('spinBtn').disabled = true;

      const numSlices = options.length;
      const sliceAngle = (2 * Math.PI) / numSlices;

      // Random target angle setup
      const extraRounds = 5 + Math.floor(Math.random() * 4);
      const randomSliceIndex = Math.floor(Math.random() * numSlices);
      
      // Pointer is at Top (1.5 * Math.PI rad)
      const targetSliceCenter = (2 * Math.PI) - (randomSliceIndex * sliceAngle + sliceAngle / 2);
      const totalRotation = (extraRounds * 2 * Math.PI) + targetSliceCenter - (currentAngle % (2 * Math.PI));

      const duration = 4500; // ms
      const startAngle = currentAngle;
      const startTime = performance.now();

      function animateSpin(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);
        
        // Cubic Easing Out
        const easeOut = 1 - Math.pow(1 - progress, 3);
        currentAngle = startAngle + totalRotation * easeOut;

        // Pointer Tick Audio & Visual Trigger
        const normalizedAngle = (2 * Math.PI - (currentAngle % (2 * Math.PI))) % (2 * Math.PI);
        const currentSegment = Math.floor(normalizedAngle / sliceAngle);
        if (currentSegment !== lastSegmentIndex) {
          sfx.playTick();
          pointer.classList.add('bounce');
          setTimeout(() => pointer.classList.remove('bounce'), 50);
          lastSegmentIndex = currentSegment;
        }

        drawWheel();

        if (progress < 1) {
          requestAnimationFrame(animateSpin);
        } else {
          isSpinning = false;
          document.getElementById('spinBtn').disabled = false;
          handleWin(options[randomSliceIndex]);
        }
      }

      requestAnimationFrame(animateSpin);
    }

    // --- WIN & CELEBRATION ---
    function handleWin(resultText) {
      sfx.playWin();
      triggerScreenShake();
      triggerParticles();

      const overlay = document.getElementById('resultOverlay');
      const resTitle = document.getElementById('resTitle');
      const resText = document.getElementById('resText');
      const nextBtn = document.getElementById('nextStageBtn');
      const combinedBox = document.getElementById('resCombinedBox');

      if (currentStage === 1) {
        stage1Result = resultText;
        resTitle.innerText = "Stage 1 Selected";
        resText.innerText = stage1Result;
        combinedBox.style.display = 'none';
        nextBtn.innerText = "Proceed to Stage 2 →";
      } else {
        stage2Result = resultText;
        resTitle.innerText = "Stage 2 Selected";
        resText.innerText = stage2Result;
        
        document.getElementById('resCombinedText').innerText = `${stage1Result} — ${stage2Result}`;
