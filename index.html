<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Night Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    :root {
      --bg: #090306;
      --panel: #14080e;
      --panel-border: #381223;
      --text: #fde8f0;
      --accent-gold: #ffb703;
      --accent-rose: #ff2a6d;
      --accent-crimson: #d90429;
      --accent-purple: #7209b7;
      --font-main: 'Outfit', -apple-system, sans-serif;
      --font-sexy: 'Playfair Display', Georgia, serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(217, 4, 41, 0.22) 0%, transparent 60%),
        radial-gradient(circle at 50% 100%, rgba(114, 9, 183, 0.18) 0%, transparent 60%);
      color: var(--text);
      font-family: var(--font-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 1.5rem 1rem;
      overflow-x: hidden;
    }

    header { text-align: center; margin-bottom: 1.2rem; }

    h1 {
      font-family: var(--font-sexy);
      font-style: italic;
      font-size: 2.8rem;
      font-weight: 900;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #fff 10%, var(--accent-rose) 60%, var(--accent-gold) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: capitalize;
      text-shadow: 0 0 30px rgba(255, 42, 109, 0.4);
    }

    .sub-heading {
      color: #b88ba0;
      font-size: 0.95rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 800;
      margin-top: 0.2rem;
    }

    .stage-indicator {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .badge {
      padding: 0.45rem 0.9rem;
      border-radius: 999px;
      font-weight: 800;
      font-size: 0.75rem;
      letter-spacing: 1px;
      background: var(--panel);
      border: 2px solid var(--panel-border);
      color: #8c5d73;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .badge.active {
      border-color: var(--accent-rose);
      color: #ffffff;
      box-shadow: 0 0 20px rgba(255, 42, 109, 0.5), inset 0 0 10px rgba(255, 42, 109, 0.2);
      transform: scale(1.08);
    }

    .badge.completed {
      border-color: var(--accent-gold);
      color: var(--accent-gold);
      box-shadow: 0 0 10px rgba(255, 183, 3, 0.2);
    }

    .main-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
      width: 100%;
      max-width: 1000px;
    }

    .wheel-card {
      position: relative;
      background: linear-gradient(180deg, #1c0a15 0%, var(--panel) 100%);
      border: 1px solid rgba(255, 42, 109, 0.3);
      border-radius: 28px;
      padding: 1.8rem 1.2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 
        0 20px 50px rgba(0, 0, 0, 0.9),
        0 0 30px rgba(217, 4, 41, 0.15),
        inset 0 1px 1px rgba(255, 255, 255, 0.1);
      width: 100%;
      max-width: 480px;
    }

    .wheel-card h2 {
      font-family: var(--font-sexy);
      font-style: italic;
      font-size: 1.6rem;
      text-shadow: 0 0 12px rgba(255, 42, 109, 0.4);
    }

    .wheel-wrapper {
      position: relative;
      width: 340px;
      height: 340px;
      margin: 1.2rem 0;
    }

    /* Right-side pointer styling */
    .pointer {
      position: absolute;
      top: 50%;
      right: -22px;
      transform: translateY(-50%);
      width: 0;
      height: 0;
      border-top: 18px solid transparent;
      border-bottom: 18px solid transparent;
      border-right: 32px solid var(--accent-gold);
      z-index: 10;
      filter: drop-shadow(0 0 12px var(--accent-gold));
      transition: transform 0.1s ease;
    }

    .pointer.bounce { transform: translateY(-50%) translateX(6px) scale(1.15); }

    canvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      box-shadow: 
        0 0 40px rgba(0, 0, 0, 0.9),
        0 0 20px rgba(255, 42, 109, 0.3);
    }

    .controls { display: flex; gap: 1rem; width: 100%; justify-content: center; }

    .btn {
      background: linear-gradient(135deg, var(--accent-crimson), var(--accent-rose));
      color: white;
      border: none;
      padding: 1rem 2.2rem;
      font-size: 1.15rem;
      font-weight: 900;
      border-radius: 16px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      box-shadow: 0 10px 30px rgba(217, 4, 41, 0.5);
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .btn:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 15px 35px rgba(255, 42, 109, 0.7);
    }
    .btn:active { transform: translateY(1px) scale(0.98); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--panel-border);
      color: #b88ba0;
      box-shadow: none;
    }
    .btn-secondary:hover { background: var(--panel-border); color: #fff; box-shadow: none; }

    .editor-section {
      width: 100%;
      max-width: 480px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 20px;
      padding: 1.1rem;
    }

    .editor-section h3 {
      font-size: 0.85rem;
      margin-bottom: 0.6rem;
      color: #b88ba0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .editor-inputs { display: flex; gap: 0.5rem; margin-bottom: 0.6rem; }

    input[type="text"] {
      flex: 1;
      background: #090306;
      border: 1px solid var(--panel-border);
      padding: 0.6rem 0.9rem;
      border-radius: 10px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
    }
    input[type="text"]:focus { outline: none; border-color: var(--accent-rose); }

    .tags-container {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      max-height: 90px;
      overflow-y: auto;
    }

    .tag {
      background: #240d1a;
      border: 1px solid #4a1835;
      padding: 0.3rem 0.7rem;
      border-radius: 8px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: #fde8f0;
    }

    .tag-remove { cursor: pointer; color: var(--accent-rose); font-weight: bold; }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(9, 3, 6, 0.9);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      z-index: 100;
    }

    .overlay.show { opacity: 1; pointer-events: auto; }

    .result-card {
      background: linear-gradient(180deg, #240b1b 0%, var(--panel) 100%);
      border: 2px solid var(--accent-gold);
      padding: 2.5rem 1.8rem;
      border-radius: 28px;
      text-align: center;
      max-width: 480px;
      width: 90%;
      transform: scale(0.8);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 0 60px rgba(255, 183, 3, 0.3);
    }

    .overlay.show .result-card { transform: scale(1); }
    .result-title { font-size: 1rem; color: var(--accent-gold); text-transform: uppercase; letter-spacing: 2px; font-weight: 800; }
    
    .result-main {
      font-family: var(--font-sexy);
      font-style: italic;
      font-size: 2.2rem;
      font-weight: 900;
      color: #fff;
      margin: 1rem 0;
      line-height: 1.2;
      text-shadow: 0 0 15px rgba(255, 42, 109, 0.5);
    }

    .result-sequence-list {
      margin-top: 1.2rem;
      text-align: left;
      background: #090306;
      padding: 1.2rem;
      border-radius: 16px;
      border: 1px dashed var(--accent-rose);
    }

    .result-seq-item { font-size: 0.95rem; margin-bottom: 0.5rem; color: #dfb8cb; }
    .result-seq-item span { color: var(--accent-gold); font-weight: 800; }

    .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
    @keyframes shake {
      10%, 90% { transform: translate3d(-1px, 0, 0); }
      20%, 80% { transform: translate3d(2px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
      40%, 60% { transform: translate3d(4px, 0, 0); }
    }

    #fx-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 90; }
  </style>
</head>

  <script>
    class SoundFX {
      constructor() {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      }
      playTick() {
        if (this.ctx.state === 'suspended') this.ctx.resume();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(450, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(90, this.ctx.currentTime + 0.04);
        gain.gain.setValueAtTime(0.18, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.04);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.04);
      }
      playWin() {
        if (this.ctx.state === 'suspended') this.ctx.resume();
        const notes = [261.63, 329.63, 392.00, 523.25];
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.08);
          gain.gain.setValueAtTime(0, this.ctx.currentTime + idx * 0.08);
          gain.gain.linearRampToValueAtTime(0.2, this.ctx.currentTime + idx * 0.08 + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.08 + 0.4);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(this.ctx.currentTime + idx * 0.08);
          osc.stop(this.ctx.currentTime + idx * 0.08 + 0.4);
        });
      }
    }

        defaultOpts: [
          "She's trying to break it off",

          "Ruined hands off",
          "Slow motion only",
          "Denial trap. Stop for 30 seconds before continuing",
          "Mrs takes control (stop/go/fast/slow etc)",

        ],
        opts: []
      }
    };

    Object.keys(masterData).forEach(k => {
      masterData[k].opts = [...masterData[k].defaultOpts];
    });

    let activeSequenceKeys = ["category", "sub_her_body", "act_standard_body", "method", "climax"];
    let currentStepIndex = 0;
    let selections = {};

    // Seductive Luxury Palette (Crimson, Deep Magenta, Rose, Velvet Purple, Gold)
    const colors = [
      '#d90429', '#7209b7', '#ff2a6d', '#800f2f', 
      '#b5179e', '#a01a58', '#4a0e17', '#c77dff'
    ];

    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    let currentAngle = 0;
    let isSpinning = false;

    function getCurrentKey() {
      return activeSequenceKeys[currentStepIndex];
    }

    function drawWheel() {
      const key = getCurrentKey();
      const options = masterData[key].opts;
      const numSlices = options.length;
      const sliceAngle = (2 * Math.PI) / numSlices;
      const radius = canvas.width / 2;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (numSlices === 0) {
        ctx.fillStyle = '#14080e';
        ctx.beginPath();
        ctx.arc(radius, radius, radius, 0, 2 * Math.PI);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 24px Outfit';
        ctx.textAlign = 'center';
        ctx.fillText('Add Options Below', radius, radius);
        return;
      }

      options.forEach((opt, idx) => {
        const start = currentAngle + (idx * sliceAngle);
        const end = start + sliceAngle;

        ctx.beginPath();
        ctx.moveTo(radius, radius);
        ctx.arc(radius, radius, radius - 10, start, end);
        ctx.closePath();
        ctx.fillStyle = colors[idx % colors.length];
        ctx.fill();
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#090306';
        ctx.stroke();

        ctx.save();
        ctx.translate(radius, radius);
        ctx.rotate(start + sliceAngle / 2);
        ctx.textAlign = 'right';
        ctx.fillStyle = '#ffffff';

        // Dynamic text size calculation based on string length & slice count for bigger readability
        let fontSize = 23;
        if (numSlices > 8) fontSize = 20;
        if (opt.length > 25) fontSize = 16;
        else if (opt.length > 18) fontSize = 18;

        ctx.font = `900 ${fontSize}px Outfit, sans-serif`;
        ctx.shadowColor = 'rgba(0, 0, 0, 0.9)';
        ctx.shadowBlur = 8;
        ctx.fillText(opt, radius - 30, fontSize / 3.2);
        ctx.restore();
      });

      // Hub styling
      ctx.beginPath();
      ctx.arc(radius, radius, 42, 0, 2 * Math.PI);
      ctx.fillStyle = '#090306';
      ctx.fill();
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#ffb703';
      ctx.stroke();
    }

    const pointer = document.getElementById('pointer');
    let lastSegmentIndex = -1;

    function spinWheel() {
      const key = getCurrentKey();
      const options = masterData[key].opts;
      if (isSpinning || options.length === 0) return;

      isSpinning = true;
      document.getElementById('spinBtn').disabled = true;

      const numSlices = options.length;
      const sliceAngle = (2 * Math.PI) / numSlices;
      const extraRounds = 5 + Math.floor(Math.random() * 4);
      const randomSliceIndex = Math.floor(Math.random() * numSlices);
      
      const pointerAngle = 0; // 3 o'clock position
      const targetSliceMid = randomSliceIndex * sliceAngle + sliceAngle / 2;
      const totalRotation = (extraRounds * 2 * Math.PI) + (pointerAngle - targetSliceMid) - (currentAngle % (2 * Math.PI));

      const duration = 4500;
      const startAngle = currentAngle;
      const startTime = performance.now();

      function animateSpin(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const easeOut = 1 - Math.pow(1 - progress, 3);
        currentAngle = startAngle + totalRotation * easeOut;

        const normalizedAngle = (0 - currentAngle) % (2 * Math.PI);
        const positiveAngle = (normalizedAngle + 2 * Math.PI) % (2 * Math.PI);
        const currentSegment = Math.floor(positiveAngle / sliceAngle) % numSlices;

        if (currentSegment !== lastSegmentIndex) {
          sfx.playTick();
          pointer.classList.add('bounce');
          setTimeout(() => pointer.classList.remove('bounce'), 50);
          lastSegmentIndex = currentSegment;
        }

        drawWheel();

        if (progress < 1) {
          requestAnimationFrame(animateSpin);
        } else {
          isSpinning = false;
          document.getElementById('spinBtn').disabled = false;
          handleWin(options[randomSliceIndex]);
        }
      }

      requestAnimationFrame(animateSpin);
    }

    function handleWin(resultText) {
      sfx.playWin();
      triggerScreenShake();
      triggerParticles();

      const key = getCurrentKey();
      selections[key] = resultText;

      // DYNAMIC BRANCHING LOGIC
      if (key === 'category') {
        if (resultText.includes("Body Part")) {
          activeSequenceKeys = ["category", "sub_her_body", "act_standard_body", "method", "climax"];
        } else if (resultText.includes("Clothing")) {
          activeSequenceKeys = ["category", "sub_clothing", "act_clothing", "method", "climax"];
        } else if (resultText.includes("Myself")) {
          activeSequenceKeys = ["category", "sub_myself", "act_myself", "method", "climax"];
        } else if (resultText.includes("Celebrity")) {
          activeSequenceKeys = ["category", "sub_celeb", "act_celeb", "method", "climax"];
        } else if (resultText.includes("Item")) {
          activeSequenceKeys = ["category", "sub_item", "act_item", "method", "climax"];
        }
      } else if (key === 'sub_her_body') {
        if (resultText === "Hair") {
          activeSequenceKeys = ["category", "sub_her_body", "method", "climax"];
        } else if (resultText === "Glasses" || resultText === "Mouth") {
          activeSequenceKeys = ["category", "sub_her_body", "act_glasses_mouth", "method", "climax"];
        } else if (resultText === "Hands") {
          activeSequenceKeys = ["category", "sub_her_body", "act_her_hands", "method", "climax"];
        } else {
          activeSequenceKeys = ["category", "sub_her_body", "act_standard_body", "method", "climax"];
        }
      }

      const overlay = document.getElementById('resultOverlay');
      const resTitle = document.getElementById('resTitle');
      const resText = document.getElementById('resText');
      const nextBtn = document.getElementById('nextStageBtn');
      const seqBox = document.getElementById('resSequenceBox');

      resTitle.innerText = `${masterData[key].title} Locked`;
      resText.innerText = resultText;

      if (currentStepIndex < activeSequenceKeys.length - 1) {
        seqBox.style.display = 'none';
        nextBtn.innerText = "Next Wheel →";
      } else {
        const seqContent = document.getElementById('resSequenceContent');
        let html = `<div class="result-seq-item">1. Category: <span>${selections['category']}</span></div>`;
        
        activeSequenceKeys.forEach((k, idx) => {
          if (idx > 0) {
            html += `<div class="result-seq-item">${idx + 1}. ${masterData[k].title}: <span>${selections[k]}</span></div>`;
          }
        });

        seqContent.innerHTML = html;
        seqBox.style.display = 'block';
        nextBtn.innerText = "Start New Run ↺";
      }

      overlay.classList.add('show');
    }

    function triggerScreenShake() {
      document.getElementById('wheel-card').classList.add('shake');
      setTimeout(() => document.getElementById('wheel-card').classList.remove('shake'), 500);
    }

    const fxCanvas = document.getElementById('fx-canvas');
    const fxCtx = fxCanvas.getContext('2d');
    let particles = [];

    function resizeFx() { fxCanvas.width = window.innerWidth; fxCanvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeFx);
    resizeFx();

    function triggerParticles() {
      particles = [];
      for (let i = 0; i < 90; i++) {
        particles.push({
          x: window.innerWidth / 2, y: window.innerHeight / 2,
          vx: (Math.random() - 0.5) * 16, vy: (Math.random() - 0.7) * 16,
          size: Math.random() * 8 + 4, color: colors[Math.floor(Math.random() * colors.length)], life: 1
        });
      }
      requestAnimationFrame(updateParticles);
    }

    function updateParticles() {
      fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
      particles.forEach(p => {
        p.x += p.vx; p.y += p.vy; p.vy += 0.3; p.life -= 0.015;
        fxCtx.fillStyle = p.color;
        fxCtx.globalAlpha = Math.max(p.life, 0);
        fxCtx.fillRect(p.x, p.y, p.size, p.size);
      });
      particles = particles.filter(p => p.life > 0);
      if (particles.length > 0) requestAnimationFrame(updateParticles);
    }

    function updateUI() {
      const key = getCurrentKey();
      const data = masterData[key];
      
      document.getElementById('stage-title').innerText = data.title;
      document.getElementById('editor-title').innerText = `Edit ${data.title}`;

      const badgeIds = ["badge-category", "badge-target", "badge-action", "badge-method", "badge-climax"];
      badgeIds.forEach((bId, idx) => {
        const badge = document.getElementById(bId);
        if (idx < currentStepIndex) badge.className = "badge completed";
        else if (idx === currentStepIndex) badge.className = "badge active";
        else badge.className = "badge";
      });

      renderTags();
      drawWheel();
    }

    function renderTags() {
      const key = getCurrentKey();
      const container = document.getElementById('tagsContainer');
      container.innerHTML = '';
      masterData[key].opts.forEach((opt, idx) => {
        const tag = document.createElement('div');
        tag.className = 'tag';
        tag.innerHTML = `<span>${opt}</span><span class="tag-remove" onclick="removeOption(${idx})">&times;</span>`;
        container.appendChild(tag);
      });
    }

    function removeOption(idx) {
      const key = getCurrentKey();
      masterData[key].opts.splice(idx, 1);
      renderTags();
      drawWheel();
    }

    document.getElementById('addOptionBtn').addEventListener('click', () => {
      const input = document.getElementById('optionInput');
      const val = input.value.trim();
      if (!val) return;
      const key = getCurrentKey();
      masterData[key].opts.push(val);
      input.value = '';
      renderTags();
      drawWheel();
    });

    document.getElementById('resetDefaultsBtn').addEventListener('click', () => {
      const key = getCurrentKey();
      masterData[key].opts = [...masterData[key].defaultOpts];
      renderTags();
      drawWheel();
    });

    document.getElementById('spinBtn').addEventListener('click', spinWheel);

    document.getElementById('nextStageBtn').addEventListener('click', () => {
      document.getElementById('resultOverlay').classList.remove('show');
      if (currentStepIndex < activeSequenceKeys.length - 1) {
        currentStepIndex++;
      } else {
        currentStepIndex = 0;
        activeSequenceKeys = ["category", "sub_her_body", "act_standard_body", "method", "climax"];
        selections = {};
      }
      updateUI();
    });

    updateUI();
  </script>
</body>
</html>
