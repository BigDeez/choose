<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Secret Vault — Blind Dice Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800;900&family=Playfair+Display:ital,wght@1,700;1,900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09050d;
      --panel: #140a1a;
      --panel-border: #2d163a;
      --text: #f5eaf8;
      --accent-gold: #d4af37;
      --accent-rose: #e63946;
      --font-main: 'Outfit', sans-serif;
      --font-serif: 'Playfair Display', serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.15) 0%, transparent 60%),
        radial-gradient(circle at 50% 100%, rgba(230, 57, 70, 0.15) 0%, transparent 60%);
      color: var(--text);
      font-family: var(--font-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 2rem 1rem;
      overflow-x: hidden;
    }

    header { text-align: center; margin-bottom: 1.5rem; }

    h1 {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 2.8rem;
      font-weight: 900;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #fff 20%, var(--accent-gold) 80%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: lowercase;
    }

    .sub-heading {
      color: #9a849f;
      font-size: 0.85rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 800;
      margin-top: 0.3rem;
    }

    .main-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      width: 100%;
      max-width: 650px;
    }

    /* Dice Section */
    .dice-stage {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 24px;
      padding: 2rem 1.5rem;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
      position: relative;
    }

    .dice-box {
      width: 100px;
      height: 100px;
      background: linear-gradient(135deg, #2a1636, #120818);
      border: 2px solid var(--accent-gold);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.5rem;
      font-weight: 900;
      color: #fff;
      margin: 1.2rem 0;
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.25);
      transition: transform 0.1s ease;
    }

    .dice-box.rolling {
      animation: spinDice 0.5s infinite linear;
    }

    @keyframes spinDice {
      0% { transform: rotate(0deg) scale(1.1); }
      50% { transform: rotate(180deg) scale(0.9); }
      100% { transform: rotate(360deg) scale(1.1); }
    }

    .btn {
      background: linear-gradient(135deg, var(--accent-gold), #997a15);
      color: #09050d;
      border: none;
      padding: 1rem 2.5rem;
      font-size: 1.15rem;
      font-weight: 900;
      border-radius: 14px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      box-shadow: 0 10px 25px rgba(212, 175, 55, 0.3);
      transition: all 0.25s ease;
    }

    .btn:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 15px 35px rgba(212, 175, 55, 0.5);
    }
    .btn:active { transform: translateY(1px) scale(0.98); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

    /* Mystery Boxes Row */
    .boxes-grid {
      display: flex;
      gap: 0.8rem;
      width: 100%;
      justify-content: center;
      margin-top: 1.5rem;
      flex-wrap: wrap;
    }

    .mystery-box {
      width: 90px;
      height: 110px;
      border-radius: 16px;
      border: 2px solid var(--panel-border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      position: relative;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    }

    .mystery-box.filled {
      border-color: var(--accent-gold);
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
      transform: scale(1.05);
    }

    .mystery-box .box-label {
      font-size: 0.7rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 800;
      opacity: 0.8;
    }

    .mystery-box .box-val {
      font-size: 1.6rem;
      font-weight: 900;
    }

    /* Unboxing Reveal Ceremony Overlay */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(9, 5, 13, 0.95);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      z-index: 100;
    }

    .overlay.show { opacity: 1; pointer-events: auto; }

    .reveal-card {
      background: var(--panel);
      border: 2px solid var(--accent-gold);
      padding: 2.5rem 1.8rem;
      border-radius: 28px;
      text-align: center;
      max-width: 520px;
      width: 90%;
      box-shadow: 0 0 60px rgba(212, 175, 55, 0.3);
    }

    .reveal-title {
      font-size: 0.85rem;
      color: var(--accent-gold);
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 800;
    }

    .reveal-item-text {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 2.2rem;
      font-weight: 900;
      color: #fff;
      margin: 1.2rem 0;
      line-height: 1.2;
      text-shadow: 0 0 20px rgba(230, 57, 70, 0.5);
    }

    .final-blueprint {
      text-align: left;
      background: #09050d;
      border: 1px dashed var(--accent-gold);
      padding: 1.2rem;
      border-radius: 16px;
      margin-top: 1rem;
    }

    .blueprint-row {
      font-size: 0.95rem;
      margin-bottom: 0.6rem;
      color: #d1b8d8;
    }

    .blueprint-row span {
      color: var(--accent-gold);
      font-weight: 800;
    }

    #fx-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 90; }
  </style>
</head>
<body>

  <canvas id="fx-canvas"></canvas>

  <header>
    <h1>The Secret Vault</h1>
    <p class="sub-heading">Blind Dice Sequence Engine</p>
  </header>

  <main class="main-container">
    <div class="dice-stage">
      <h2 id="stagePrompt" style="font-family: var(--font-serif); font-style: italic; font-size: 1.6rem; color: var(--accent-gold);">Roll 1: Mystery Box 1</h2>
      
      <div class="dice-box" id="diceBox">?</div>

      <button class="btn" id="rollBtn">ROLL DICE</button>

      <div class="boxes-grid" id="boxesGrid"></div>
    </div>
  </main>

  <!-- Reveal Modal -->
  <div class="overlay" id="revealOverlay">
    <div class="reveal-card">
      <div class="reveal-title" id="revTitle">Unboxing Stage 1...</div>
      <div class="reveal-item-text" id="revText">...</div>

      <div class="final-blueprint" id="finalBlueprint" style="display: none;">
        <div style="font-size: 0.8rem; color: var(--accent-gold); text-transform: uppercase; font-weight: 800; letter-spacing: 1px; margin-bottom: 0.8rem;">Master Execution Plan</div>
        <div id="blueprintRows"></div>
      </div>

      <button class="btn" id="nextUnboxBtn" style="width: 100%; margin-top: 1.5rem;">Explode Next Box 💥</button>
    </div>
  </main>

  <script>
    class SoundFX {
      constructor() {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      }
      playRoll() {
        if (this.ctx.state === 'suspended') this.ctx.resume();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.1);
      }
      playExplode() {
        if (this.ctx.state === 'suspended') this.ctx.resume();
        const notes = [200, 400, 600, 800];
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.05);
          gain.gain.setValueAtTime(0.2, this.ctx.currentTime + idx * 0.05);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.05 + 0.3);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(this.ctx.currentTime + idx * 0.05);
          osc.stop(this.ctx.currentTime + idx * 0.05 + 0.3);
        });
      }
    }

    const sfx = new SoundFX();

    // GAME DATA POOL
    const poolData = {
      categories: ["Body Part (Her)", "Clothing", "Myself", "Celebrity / Fantasy", "Item / Prop"],
      sub_her_body: ["Boobs", "Face", "Glasses", "Legs", "Booty", "Pussy", "Feet", "Mouth", "Hair", "Hands"],
      sub_clothing: ["Bra", "Knickers", "Skirt", "Shirt", "Hijab", "Dress", "Heels", "Jeans", "Gloves", "Stockings"],
      sub_myself: ["Stomach", "Balls", "Chest", "Hand", "Face", "Feet"],
      sub_celeb: ["Holly Willoughby", "Maya Jama", "Kelly Brook", "Amanda Holden", "Michelle Keegan", "Rita Ora", "Florence Pugh", "Gemma Atkinson"],
      sub_item: ["Waffle Blanket", "Kitchen Counter", "Mirror", "Sofa Cushion", "Car Bonnet", "Chair", "Phone Screen"],
      
      act_standard: ["Leave on", "Clean off", "Play with it", "Take pictures", "Taste it", "Share it"],
      act_glasses_mouth: ["Take pictures", "Taste it", "Swallow", "Share it"],
      act_hands: ["Taste it", "Share it", "Play with it", "Use as lube", "Rub in face", "Put in ass"],
      act_celeb: ["Blindfold Him + Wank Over Celeb (Pics for Humiliation / Self-Play)"],

      methods: ["Blowjob", "Hand job", "Paired (Hand & Mouth)", "Pick a Hand Technique", "Slow vs Speed", "Toy Assisted"],
      
      climax: [
        "She's trying to break it off",
        "No stopping till every drop is out",
        "Edge 3 times before release",
        "Ruined hands off",
        "Slow motion only",
        "Denial trap. Stop for 30 seconds before continuing",
        "Mrs takes control (stop/go/fast/slow etc)",
        "Cock and ball torture"
      ]
    };

    // Shuffled palette of colors for the boxes so colors change every single game
    const boxColorsPool = [
      { name: "Velvet", bg: "#4a0e17", border: "#e63946" },
      { name: "Gold", bg: "#3a2e0b", border: "#d4af37" },
      { name: "Emerald", bg: "#0b2e1b", border: "#2a9d8f" },
      { name: "Midnight", bg: "#101b3b", border: "#4cc9f0" },
      { name: "Amethyst", bg: "#2a0b3b", border: "#7209b7" }
    ];

    let currentRollStep = 0;
    let diceResults = [];
    let activeBoxColors = [];
    let unboxStep = 0;
    let finalBlueprintData = [];

    function shuffle(array) {
      return array.sort(() => Math.random() - 0.5);
    }

    function initGame() {
      currentRollStep = 0;
      diceResults = [];
      unboxStep = 0;
      finalBlueprintData = [];
      activeBoxColors = shuffle([...boxColorsPool]);

      document.getElementById('stagePrompt').innerText = `Roll 1: ${activeBoxColors[0].name} Box`;
      document.getElementById('diceBox').innerText = '?';
      document.getElementById('rollBtn').disabled = false;

      const grid = document.getElementById('boxesGrid');
      grid.innerHTML = '';
      for (let i = 0; i < 5; i++) {
        const box = document.createElement('div');
        box.className = 'mystery-box';
        box.id = `box-${i}`;
        box.style.background = activeBoxColors[i].bg;
        box.style.borderColor = activeBoxColors[i].border;
        box.innerHTML = `
          <div class="box-label" style="color:${activeBoxColors[i].border}">${activeBoxColors[i].name}</div>
          <div class="box-val" id="box-val-${i}">?</div>
        `;
        grid.appendChild(box);
      }
    }

    const rollBtn = document.getElementById('rollBtn');
    const diceBox = document.getElementById('diceBox');

    rollBtn.addEventListener('click', () => {
      rollBtn.disabled = true;
      diceBox.classList.add('rolling');

      let rolls = 0;
      const interval = setInterval(() => {
        sfx.playRoll();
        diceBox.innerText = Math.floor(Math.random() * 6) + 1;
        rolls++;
        if (rolls > 12) {
          clearInterval(interval);
          diceBox.classList.remove('rolling');
          
          const finalVal = Math.floor(Math.random() * 6) + 1;
          diceBox.innerText = finalVal;
          diceResults.push(finalVal);

          // Update Box UI
          const currentBox = document.getElementById(`box-${currentRollStep}`);
          currentBox.classList.add('filled');
          document.getElementById(`box-val-${currentRollStep}`).innerText = finalVal;

          currentRollStep++;

          if (currentRollStep < 5) {
            document.getElementById('stagePrompt').innerText = `Roll ${currentRollStep + 1}: ${activeBoxColors[currentRollStep].name} Box`;
            rollBtn.disabled = false;
          } else {
            document.getElementById('stagePrompt').innerText = "All Boxes Locked! Ready to Reveal...";
            rollBtn.innerText = "UNSEAL THE VAULT 🔓";
            rollBtn.disabled = false;
            rollBtn.onclick = startUnboxingCeremony;
          }
        }
      }, 80);
    });

    // UNBOXING CEREMONY & EXPLO-REVEAL
    function startUnboxingCeremony() {
      // Calculate the selections based on dice results
      const cat = poolData.categories[(diceResults[0] - 1) % poolData.categories.length];
      
      let targetPool = poolData.sub_her_body;
      let actPool = poolData.act_standard;

      if (cat.includes("Clothing")) {
        targetPool = poolData.sub_clothing;
        actPool = poolData.act_standard;
      } else if (cat.includes("Myself")) {
        targetPool = poolData.sub_myself;
        actPool = poolData.act_standard;
      } else if (cat.includes("Celebrity")) {
        targetPool = poolData.sub_celeb;
        actPool = poolData.act_celeb;
      } else if (cat.includes("Item")) {
        targetPool = poolData.sub_item;
        actPool = poolData.act_standard;
      }

      const target = targetPool[(diceResults[1] - 1) % targetPool.length];

      // Dynamic action override if body part
      if (cat.includes("Body Part")) {
        if (target === "Glasses" || target === "Mouth") actPool = poolData.act_glasses_mouth;
        else if (target === "Hands") actPool = poolData.act_hands;
      }

      const action = actPool[(diceResults[2] - 1) % actPool.length];
      const method = poolData.methods[(diceResults[3] - 1) % poolData.methods.length];
      const climaxRule = poolData.climax[(diceResults[4] - 1) % poolData.climax.length];

      finalBlueprintData = [
        { title: "Stage 1: Category", val: cat },
        { title: "Stage 2: Target", val: target },
        { title: "Stage 3: Action", val: action },
        { title: "Stage 4: Method", val: method },
        { title: "Stage 5: Over The Edge", val: climaxRule }
      ];

      unboxStep = 0;
      document.getElementById('revealOverlay').classList.add('show');
      showUnboxStep();
    }

    function showUnboxStep() {
      sfx.playExplode();
      triggerParticles();

      const item = finalBlueprintData[unboxStep];
      const colorObj = activeBoxColors[unboxStep];

      document.getElementById('revTitle').innerText = `Exploding ${colorObj.name} Box (Dice Rolled: ${diceResults[unboxStep]})`;
      document.getElementById('revTitle').style.color = colorObj.border;
      document.getElementById('revText').innerText = item.val;

      const nextBtn = document.getElementById('nextUnboxBtn');

      if (unboxStep < 4) {
        document.getElementById('finalBlueprint').style.display = 'none';
        nextBtn.innerText = `Explode ${activeBoxColors[unboxStep + 1].name} Box 💥`;
      } else {
        // Show master final blueprint
        const bpRows = document.getElementById('blueprintRows');
        bpRows.innerHTML = '';
        finalBlueprintData.forEach((d, i) => {
          bpRows.innerHTML += `<div class="blueprint-row">${i + 1}. ${d.title}: <span>${d.val}</span></div>`;
        });

        document.getElementById('finalBlueprint').style.display = 'block';
        nextBtn.innerText = "Start New Game ↺";
      }
    }

    document.getElementById('nextUnboxBtn').addEventListener('click', () => {
      if (unboxStep < 4) {
        unboxStep++;
        showUnboxStep();
      } else {
        document.getElementById('revealOverlay').classList.remove('show');
        location.reload();
      }
    });

    // Particle Burst Canvas
    const fxCanvas = document.getElementById('fx-canvas');
    const fxCtx = fxCanvas.getContext('2d');
    let particles = [];

    function resizeFx() { fxCanvas.width = window.innerWidth; fxCanvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeFx);
    resizeFx();

    function triggerParticles() {
      particles = [];
      const colors = ['#d4af37', '#e63946', '#7209b7', '#4cc9f0', '#2a9d8f'];
      for (let i = 0; i < 100; i++) {
        particles.push({
          x: window.innerWidth / 2, y: window.innerHeight / 2,
          vx: (Math.random() - 0.5) * 18, vy: (Math.random() - 0.7) * 18,
          size: Math.random() * 8 + 4, color: colors[Math.floor(Math.random() * colors.length)], life: 1
        });
      }
      requestAnimationFrame(updateParticles);
    }

    function updateParticles() {
      fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
      particles.forEach(p => {
        p.x += p.vx; p.y += p.vy; p.vy += 0.3; p.life -= 0.015;
        fxCtx.fillStyle = p.color;
        fxCtx.globalAlpha = Math.max(p.life, 0);
        fxCtx.fillRect(p.x, p.y, p.size, p.size);
      });
      particles = particles.filter(p => p.life > 0);
      if (particles.length > 0) requestAnimationFrame(updateParticles);
    }

    initGame();
  </script>
</body>
</html>
