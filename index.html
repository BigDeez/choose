<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nocturne — The 3D Intimate Vault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;900&family=Playfair+Display:ital,wght@1,700;1,900&display=swap" rel="stylesheet">
  <!-- Load Three.js for 3D Graphics -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    :root {
      --bg: #050208;
      --panel: #0d0612;
      --panel-border: #3b174a;
      --text: #f9f0fc;
      --accent-gold: #f3c653;
      --accent-rose: #ff2a6d;
      --font-main: 'Outfit', sans-serif;
      --font-serif: 'Playfair Display', serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow-x: hidden;
      padding: 1rem;
    }

    header { text-align: center; margin-top: 0.5rem; z-index: 10; }

    h1 {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 2.5rem;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #fff 20%, var(--accent-gold) 80%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: lowercase;
    }

    .sub-heading {
      color: #a88ba8;
      font-size: 0.75rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      font-weight: 800;
    }

    #webgl-container {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    /* Interactive HUD Overlay */
    .hud-layer {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 700px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1rem;
      pointer-events: none;
    }

    .hud-layer > * {
      pointer-events: auto;
    }

    .control-panel {
      background: rgba(13, 6, 18, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      border-radius: 24px;
      padding: 1.5rem;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 1px 1px rgba(255,255,255,0.1);
      text-align: center;
    }

    .instruction-text {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 1.4rem;
      color: var(--accent-gold);
      margin-bottom: 1rem;
    }

    .btn {
      background: linear-gradient(135deg, var(--accent-gold), #b38b25);
      color: #050208;
      border: none;
      padding: 0.9rem 2.2rem;
      font-size: 1.05rem;
      font-weight: 900;
      border-radius: 14px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      box-shadow: 0 10px 25px rgba(243, 198, 83, 0.3);
      transition: all 0.25s ease;
    }

    .btn:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 15px 30px rgba(243, 198, 83, 0.5);
    }
    .btn:active { transform: translateY(1px) scale(0.98); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

    /* Box Choice Grid for Her */
    .box-choice-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.6rem;
      width: 100%;
      margin-top: 1rem;
    }

    .box-choice-btn {
      background: #190a24;
      border: 2px solid var(--panel-border);
      border-radius: 14px;
      padding: 0.8rem 0.4rem;
      color: #fff;
      font-weight: 800;
      font-size: 0.8rem;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3px;
    }

    .box-choice-btn:hover:not(:disabled) {
      border-color: var(--accent-gold);
      transform: translateY(-3px);
      box-shadow: 0 0 15px rgba(243, 198, 83, 0.3);
    }

    .box-choice-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      border-color: #22102e;
    }

    /* Cinematic Modal */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 2, 8, 0.96);
      backdrop-filter: blur(15px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      z-index: 100;
    }

    .overlay.show { opacity: 1; pointer-events: auto; }

    .modal-card {
      background: var(--panel);
      border: 2px solid var(--accent-gold);
      padding: 2.2rem 1.8rem;
      border-radius: 28px;
      text-align: center;
      max-width: 560px;
      width: 90%;
      box-shadow: 0 0 70px rgba(243, 198, 83, 0.35);
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-title {
      font-size: 0.85rem;
      color: var(--accent-gold);
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 800;
    }

    .modal-main-text {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 2.2rem;
      font-weight: 900;
      color: #fff;
      margin: 1rem 0;
      line-height: 1.2;
    }

    .celeb-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
      margin-top: 0.8rem;
      text-align: left;
    }

    .celeb-card {
      background: #050208;
      border: 1px solid var(--panel-border);
      padding: 0.6rem 0.8rem;
      border-radius: 12px;
    }

    .celeb-folder {
      font-size: 0.7rem;
      color: var(--accent-gold);
      text-transform: uppercase;
      font-weight: 800;
    }

    .celeb-name {
      font-size: 0.95rem;
      font-weight: 800;
      color: #fff;
      margin-top: 0.2rem;
    }

    .blueprint-box {
      text-align: left;
      background: #050208;
      border: 1px dashed var(--accent-gold);
      padding: 1.1rem;
      border-radius: 14px;
      margin-top: 1rem;
    }

    .blueprint-row {
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
      color: #e2cce6;
    }

    .blueprint-row span {
      color: var(--accent-gold);
      font-weight: 900;
    }
  </style>
</head>
<body>

  <!-- Three.js 3D Canvas Container -->
  <div id="webgl-container"></div>

  <header>
    <h1>Nocturne</h1>
    <p class="sub-heading">Interactive 3D Vault Engine</p>
  </header>

  <div class="hud-layer">
    <div class="control-panel" id="controlPanel">
      <div class="instruction-text" id="instructionText">Roll the 3D dice to generate your value</div>
      
      <div id="rollActionArea">
        <button class="btn" id="rollDiceBtn">Roll Dice 🎲</button>
      </div>

      <div id="placeActionArea" style="display: none; width: 100%;">
        <div style="font-size: 0.9rem; color: #a88ba8; margin-bottom: 0.5rem;">Rolled Value: <span id="currentRollVal" style="color:var(--accent-gold); font-size:1.4rem; font-weight:900;">?</span></div>
        <div style="font-size: 0.85rem; font-weight: 700; margin-bottom: 0.4rem;">She chooses which mystery box receives this roll:</div>
        <div class="box-choice-grid" id="boxChoiceGrid"></div>
      </div>
    </div>
  </div>

  <!-- Cinematic Reveal Modal -->
  <div class="overlay" id="revealOverlay">
    <div class="modal-card">
      <div class="modal-title" id="modalTitle">Unboxing Box...</div>
      <div id="modalContentContainer">
        <div class="modal-main-text" id="modalMainText">...</div>
      </div>

      <div class="blueprint-box" id="blueprintBox" style="display: none;">
        <div style="font-size: 0.8rem; color: var(--accent-gold); text-transform: uppercase; font-weight: 900; letter-spacing: 1px; margin-bottom: 0.6rem;">Master Execution Blueprint</div>
        <div id="blueprintRows"></div>
      </div>

      <button class="btn" id="modalNextBtn" style="width: 100%; margin-top: 1.2rem;">Unseal Next Box 💥</button>
    </div>
  </div>

  <script>
    // FULL CELEBRITY DATABASE SUB-FOLDERS & NAMES
    const celebrityDatabase = {
      "Royals / Politicians": ["Angela Rayner", "Kate (Princess)", "Louise Haigh", "Penny Mordaunt", "Zarah Sultana"],
      "News / Weather": ["Abby Dewhurst", "Amy Garcia", "Charlotte Hawkins", "Fiona Bruce", "Jo Blythe", "Kate Garraway", "Katherine Shrevesbou", "Keeley Donovan", "Laura Tobin", "Lucrezia Millarini", "Lucy Verasamy", "Laxmy Gopal", "Naga Munchetty", "Ranvir Singh", "Sally Nugent", "Sian Williams", "Susanna Reid", "Tina Daheley"],
      "Hospital Dramas": ["Angela Griffin", "Nina Wadia", "Sunetra Sarker", "Tina Hobley"],
      "Emmerdale": ["Beth Cordingly", "Charley Webb", "Claire King", "Fiona Wade", "Hayley Tamaddon", "Isabel Hodgins", "Lucy Pargeter", "Natalie Anderson", "Natalie J Robb", "Rebecca Sarker", "Roxanne Pallett", "Sammy Winward", "Verity Rushworth", "Zoe Henry"],
      "Eastenders": ["Charlie Brooks", "Jo Joyner", "Kara Tointon", "Lacey Turner", "Louisa Lytton", "Martine McCutcheon", "Samantha Womack", "Shona McGarty"],
      "Coronation Street": ["Alexandra Mardell", "Brooke Vincent", "Catherine Tyldesley", "Faye Brookes", "Georgia May Foote", "Helen Flanagan", "Jane Danson", "Julia Goulding", "Katherine Kelly", "Katie McGlynn", "Kym Marsh", "Michelle Keegan", "Nikki Sanderson", "Sair Khan", "Sally Lindsay", "Samia Longchambon", "Shobna Gulati", "Suranne Jones", "Tina O'Brien", "Tupele Dorgu", "Vicky Binns"],
      "911": ["Athena (Angela Bassett)", "Grace (Sierra McClain)", "Maddie (Jennifer Love Hewitt)", "Marjan (Natacha Karam)", "Nancy (Brianna Baker)", "Tommy (Gina Torres)"]
    };

    function getRandomCelebs(count = 6) {
      const all = [];
      Object.keys(celebrityDatabase).forEach(cat => {
        celebrityDatabase[cat].forEach(name => {
          all.push({ category: cat, name: name });
        });
      });
      return all.sort(() => Math.random() - 0.5).slice(0, count);
    }

    const poolData = {
      categories: ["Body Part (Her)", "Clothing", "Myself", "Celebrity / Fantasy", "Item / Prop"],
      sub_her_body: ["Boobs", "Face", "Glasses", "Legs", "Booty", "Pussy", "Feet", "Mouth", "Hair", "Hands"],
      sub_clothing: ["Bra", "Knickers", "Skirt", "Shirt", "Hijab", "Dress", "Heels", "Jeans", "Gloves", "Stockings"],
      sub_myself: ["Stomach", "Balls", "Chest", "Hand", "Face", "Feet"],
      sub_item: ["Waffle Blanket", "Kitchen Counter", "Mirror", "Sofa Cushion", "Car Bonnet", "Chair", "Phone Screen"],
      
      act_standard: ["Leave on", "Clean off", "Play with it", "Take pictures", "Taste it", "Share it"],
      act_glasses_mouth: ["Take pictures", "Taste it", "Swallow", "Share it"],
      act_hands: ["Taste it", "Share it", "Play with it", "Use as lube", "Rub in face", "Put in ass"],
      act_celeb: ["Blindfold Him + Wank Over Celeb (Pics for Humiliation / Self-Play)"],

      methods: ["Blowjob", "Hand job", "Paired (Hand & Mouth)", "Pick a Hand Technique", "Slow vs Speed", "Toy Assisted"],
      
      climax: [
        "She's trying to break it off",
        "No stopping till every drop is out",
        "Edge 3 times before release",
        "Ruined hands off",
        "Slow motion only",
        "Denial trap. Stop for 30 seconds before continuing",
        "Mrs takes control (stop/go/fast/slow etc)",
        "Cock and ball torture"
      ]
    };

    // THREE.JS 3D ENVIRONMENT SETUP
    const container = document.getElementById('webgl-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050208, 0.035);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 4, 11);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const pointLight1 = new THREE.PointLight(0xf3c653, 2, 20);
    pointLight1.position.set(0, 5, 2);
    scene.add(pointLight1);

    const pointLight2 = new THREE.PointLight(0xff2a6d, 2, 25);
    pointLight2.position.set(-5, -2, -2);
    scene.add(pointLight2);

    // 3D Mystery Boxes Setup
    const boxConfigs = [
      { name: "Velvet", color: 0xaa1133 },
      { name: "Gold", color: 0xd4af37 },
      { name: "Emerald", color: 0x118855 },
      { name: "Midnight", color: 0x2244aa },
      { name: "Amethyst", color: 0x7722aa }
    ];

    const boxMeshes = [];
    const boxSpacing = 2.4;
    const startX = -((boxConfigs.length - 1) * boxSpacing) / 2;

    boxConfigs.forEach((cfg, idx) => {
      const geometry = new THREE.BoxGeometry(1.6, 1.8, 1.6);
      const material = new THREE.MeshStandardMaterial({
        color: cfg.color,
        roughness: 0.2,
        metalness: 0.8,
        emissive: cfg.color,
        emissiveIntensity: 0.15
      });
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.set(startX + idx * boxSpacing, -0.5, 0);
      mesh.userData = { id: idx, name: cfg.name, assignedValue: null, isOpen: false };
      scene.add(mesh);
      boxMeshes.push(mesh);
    });

    // Handle window resizing
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // GAME STATE LOGIC
    let currentRollValue = null;
    let placedCount = 0;
    let unboxIndex = 0;
    let masterBlueprint = [];

    const instructionText = document.getElementById('instructionText');
    const rollActionArea = document.getElementById('rollActionArea');
    const placeActionArea = document.getElementById('placeActionArea');
    const currentRollValEl = document.getElementById('currentRollVal');
    const boxChoiceGrid = document.getElementById('boxChoiceGrid');

    document.getElementById('rollDiceBtn').addEventListener('click', () => {
      document.getElementById('rollDiceBtn').disabled = true;
      instructionText.innerText = "Rolling 3D Dice...";

      let counter = 0;
      const rollInterval = setInterval(() => {
        currentRollValue = Math.floor(Math.random() * 6) + 1;
        currentRollValEl.innerText = currentRollValue;
        counter++;

        // Spin boxes slightly for tactile feel
        boxMeshes.forEach(b => { b.rotation.y += 0.2; });

        if (counter > 12) {
          clearInterval(rollInterval);
          instructionText.innerText = "Roll locked! Where should she place it?";
          rollActionArea.style.display = 'none';
          placeActionArea.style.display = 'block';
          renderBoxChoiceButtons();
        }
      }, 70);
    });

    function renderBoxChoiceButtons() {
      boxChoiceGrid.innerHTML = '';
      boxMeshes.forEach((mesh, idx) => {
        const btn = document.createElement('button');
        btn.className = 'box-choice-btn';
        const isFilled = mesh.userData.assignedValue !== null;
        btn.disabled = isFilled;
        btn.innerHTML = `<span>${mesh.userData.name}</span><span style="font-size:1.1rem; color:var(--accent-gold);">${isFilled ? '✓ Locked' : 'Empty'}</span>`;
        btn.onclick = () => assignRollToBox(idx);
        boxChoiceGrid.appendChild(btn);
      });
    }

    function assignRollToBox(boxIdx) {
      boxMeshes[boxIdx].userData.assignedValue = currentRollValue;
      placedCount++;

      // Visual feedback on 3D box
      boxMeshes[boxIdx].material.emissiveIntensity = 0.6;

      placeActionArea.style.display = 'none';

      if (placedCount < 5) {
        instructionText.innerText = `Roll for Box ${placedCount + 1}`;
        rollActionArea.style.display = 'block';
        document.getElementById('rollDiceBtn').disabled = false;
      } else {
        instructionText.innerText = "All Boxes Loaded! Ready to Unseal.";
        startUnboxingCeremony();
      }
    }

    function startUnboxingCeremony() {
      // Calculate outcomes based on the user-placed dice values
      const catVal = boxMeshes[0].userData.assignedValue;
      const targetValDice = boxMeshes[1].userData.assignedValue;
      const actionValDice = boxMeshes[2].userData.assignedValue;
      const methodValDice = boxMeshes[3].userData.assignedValue;
      const climaxValDice = boxMeshes[4].userData.assignedValue;

      const cat = poolData.categories[(catVal - 1) % poolData.categories.length];
      
      let targetPool = poolData.sub_her_body;
      let actPool = poolData.act_standard;
      let isCeleb = false;

      if (cat.includes("Clothing")) targetPool = poolData.sub_clothing;
      else if (cat.includes("Myself")) targetPool = poolData.sub_myself;
      else if (cat.includes("Celebrity")) { isCeleb = true; actPool = poolData.act_celeb; }
      else if (cat.includes("Item")) targetPool = poolData.sub_item;

      let targetText = "";
      let celebList = [];

      if (isCeleb) {
        celebList = getRandomCelebs(6);
        targetText = "6 Random Celeb Folders";
      } else {
        targetText = targetPool[(targetValDice - 1) % targetPool.length];
      }

      if (cat.includes("Body Part")) {
        if (targetText === "Glasses" || targetText === "Mouth") actPool = poolData.act_glasses_mouth;
        else if (targetText === "Hands") actPool = poolData.act_hands;
      }

      const actionText = actPool[(actionValDice - 1) % actPool.length];
      const methodText = poolData.methods[(methodValDice - 1) % poolData.methods.length];
      const climaxText = poolData.climax[(climaxValDice - 1) % poolData.climax.length];

      masterBlueprint = [
        { title: "Stage 1: Category", val: cat, isCeleb: false },
        { title: "Stage 2: Target", val: targetText, isCeleb: isCeleb, celebs: celebList },
        { title: "Stage 3: Action", val: actionText, isCeleb: false },
        { title: "Stage 4: Method", val: methodText, isCeleb: false },
        { title: "Stage 5: Over The Edge", val: climaxText, isCeleb: false }
      ];

      unboxIndex = 0;
      document.getElementById('revealOverlay').classList.add('show');
      renderUnboxStep();
    }

    function renderUnboxStep() {
      const stageData = masterBlueprint[unboxIndex];
      const boxObj = boxMeshes[unboxIndex];

      document.getElementById('modalTitle').innerText = `Unboxing ${boxObj.userData.name} Box (Rolled: ${boxObj.userData.assignedValue})`;
      const containerEl = document.getElementById('modalContentContainer');

      if (stageData.isCeleb) {
        let html = `<div style="font-size:1.1rem; color:var(--accent-gold); font-weight:800; margin-bottom:0.5rem;">Pick 1 of 6 Random Celebs:</div>`;
        html += `<div class="celeb-grid">`;
        stageData.celebs.forEach((c, idx) => {
          html += `
            <div class="celeb-card">
              <div class="celeb-folder">📂 ${c.category}</div>
              <div class="celeb-name">${idx + 1}. ${c.name}</div>
            </div>
          `;
        });
        html += `</div>`;
        containerEl.innerHTML = html;
      } else {
        containerEl.innerHTML = `<div class="modal-main-text">${stageData.val}</div>`;
      }

      const nextBtn = document.getElementById('modalNextBtn');
      if (unboxIndex < 4) {
        document.getElementById('blueprintBox').style.display = 'none';
        nextBtn.innerText = `Unseal ${boxMeshes[unboxIndex + 1].userData.name} Box 💥`;
      } else {
        const bpRows = document.getElementById('blueprintRows');
        bpRows.innerHTML = '';
        masterBlueprint.forEach((d, i) => {
          bpRows.innerHTML += `<div class="blueprint-row">${i + 1}. ${d.title}: <span>${d.val}</span></div>`;
        });
        document.getElementById('blueprintBox').style.display = 'block';
        nextBtn.innerText = "Start New Session ↺";
      }
    }

    document.getElementById('modalNextBtn').addEventListener('click', () => {
      if (unboxIndex < 4) {
        unboxIndex++;
        renderUnboxStep();
      } else {
        document.getElementById('revealOverlay').classList.remove('show');
        location.reload();
      }
    });

    // Render loop for smooth 3D box floating
    let clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const time = clock.getElapsedTime();

      boxMeshes.forEach((mesh, i) => {
        mesh.position.y = -0.5 + Math.sin(time * 1.5 + i) * 0.15;
        mesh.rotation.y += 0.005;
      });

      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
