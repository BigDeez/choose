<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nocturne — The 3D Intimate Vault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Playfair+Display:ital,wght@1,600;1,800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    :root {
      --bg: #07040a;
      --panel: #120818;
      --panel-border: #2c1438;
      --text: #f8f0fa;
      --accent-gold: #f3c653;
      --accent-rose: #ff2a6d;
      --font-main: 'Outfit', sans-serif;
      --font-serif: 'Playfair Display', serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow-x: hidden;
      padding: 1rem;
    }

    header { text-align: center; margin-top: 0.5rem; z-index: 10; }

    h1 {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #fff 20%, var(--accent-gold) 80%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: lowercase;
    }

    .sub-heading {
      color: #9a849f;
      font-size: 0.75rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 600;
    }

    #webgl-container { position: fixed; inset: 0; z-index: 1; }
    #fx-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 95; }

    .start-screen {
      position: fixed;
      inset: 0;
      background: rgba(7, 4, 10, 0.96);
      backdrop-filter: blur(15px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 150;
      text-align: center;
      padding: 2rem;
    }

    .start-screen h2 {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 3rem;
      color: var(--accent-gold);
      margin-bottom: 0.5rem;
    }

    .start-screen p {
      color: #9a849f;
      font-size: 1.05rem;
      max-width: 450px;
      margin-bottom: 2rem;
      line-height: 1.5;
    }

    .hud-layer {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 650px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1rem;
      pointer-events: none;
    }

    .hud-layer > * { pointer-events: auto; }

    .control-panel {
      background: rgba(18, 8, 24, 0.85);
      backdrop-filter: blur(15px);
      border: 1px solid var(--panel-border);
      border-radius: 24px;
      padding: 1.5rem;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      text-align: center;
    }

    .instruction-text {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 1.4rem;
      color: var(--accent-gold);
      margin-bottom: 0.8rem;
    }

    .btn {
      background: linear-gradient(135deg, var(--accent-gold), #b38b25);
      color: #07040a;
      border: none;
      padding: 0.9rem 2.2rem;
      font-size: 1.05rem;
      font-weight: 800;
      border-radius: 14px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      box-shadow: 0 10px 25px rgba(243, 198, 83, 0.3);
      transition: all 0.25s ease;
    }

    .btn:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 15px 30px rgba(243, 198, 83, 0.5);
    }
    .btn:active { transform: translateY(1px) scale(0.98); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

    .box-choice-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.6rem;
      width: 100%;
      margin-top: 1rem;
    }

    .box-choice-btn {
      background: #190f1d;
      border: 2px solid var(--panel-border);
      border-radius: 14px;
      padding: 0.8rem 0.4rem;
      color: #fff;
      font-weight: 800;
      font-size: 0.75rem;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
    }

    .box-choice-btn:hover:not(:disabled) {
      border-color: var(--accent-gold);
      transform: translateY(-3px);
      box-shadow: 0 0 15px rgba(243, 198, 83, 0.4);
    }

    .box-choice-btn:disabled {
      opacity: 0.25;
      cursor: not-allowed;
      border-color: #190f1d;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(7, 4, 10, 0.96);
      backdrop-filter: blur(15px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      z-index: 100;
    }

    .overlay.show { opacity: 1; pointer-events: auto; }

    .modal-card {
      background: var(--panel);
      border: 2px solid var(--accent-gold);
      padding: 2.2rem 1.8rem;
      border-radius: 28px;
      text-align: center;
      max-width: 560px;
      width: 90%;
      box-shadow: 0 0 70px rgba(243, 198, 83, 0.35);
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-title {
      font-size: 0.85rem;
      color: var(--accent-gold);
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 800;
    }

    .modal-main-text {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 2.2rem;
      font-weight: 800;
      color: #fff;
      margin: 1rem 0;
      line-height: 1.2;
    }

    .blueprint-box {
      text-align: left;
      background: #07040a;
      border: 1px dashed var(--accent-gold);
      padding: 1.1rem;
      border-radius: 14px;
      margin-top: 1rem;
    }

    .blueprint-row {
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
      color: #d1b8d8;
    }

    .blueprint-row span {
      color: var(--accent-gold);
      font-weight: 800;
    }

    .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
    @keyframes shake {
      10%, 90% { transform: translate3d(-2px, 0, 0); }
      20%, 80% { transform: translate3d(3px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-5px, 0, 0); }
      40%, 60% { transform: translate3d(5px, 0, 0); }
    }
  </style>
</head>
<body>

  <canvas id="fx-canvas"></canvas>
  <div id="webgl-container"></div>

  <div class="start-screen" id="startScreen">
    <h2>The Vault</h2>
    <p>5 Dice Rolls. 5 Mystery Boxes. Choose your unboxing order.</p>
    <button class="btn" id="initGameBtn">Initiate Session 🔥</button>
  </div>

  <header>
    <h1>Nocturne</h1>
    <p class="sub-heading">Interactive 3D Vault Engine</p>
  </header>

  <div class="hud-layer">
    <div class="control-panel" id="controlPanel">
      <div class="instruction-text" id="instructionText">Roll 1 of 5</div>
      
      <div id="rollActionArea">
        <button class="btn" id="rollDiceBtn">Roll Ivory Dice 🎲</button>
      </div>

      <div id="placeActionArea" style="display: none; width: 100%;">
        <div style="font-size: 0.9rem; color: #9a849f; margin-bottom: 0.4rem;">Rolled Value: <span id="currentRollVal" style="color:var(--accent-gold); font-size:1.5rem; font-weight:800;">?</span></div>
        <div style="font-size: 0.85rem; font-weight: 600; margin-bottom: 0.5rem; color:#fff;">She chooses which mystery box receives this roll:</div>
        <div class="box-choice-grid" id="boxChoiceGrid"></div>
      </div>

      <div id="unsealActionArea" style="display: none;">
        <button class="btn" id="unsealVaultBtn">UNSEAL THE VAULT 🔓</button>
      </div>

      <div id="interactiveUnboxArea" style="display: none; width: 100%;">
        <div style="font-size: 0.85rem; font-weight: 600; margin-bottom: 0.5rem; color:var(--accent-gold);">She picks which box to explode next:</div>
        <div class="box-choice-grid" id="unboxChoiceGrid"></div>
      </div>
    </div>
  </div>

  <div class="overlay" id="revealOverlay">
    <div class="modal-card" id="modalCard">
      <div class="modal-title" id="modalTitle">Unboxing Box...</div>
      <div id="modalContentContainer">
        <div class="modal-main-text" id="modalMainText">...</div>
      </div>

      <div class="blueprint-box" id="blueprintBox" style="display: none;">
        <div style="font-size: 0.8rem; color: var(--accent-gold); text-transform: uppercase; font-weight: 800; letter-spacing: 1px; margin-bottom: 0.6rem;">Master Execution Plan</div>
        <div id="blueprintRows"></div>
      </div>

      <button class="btn" id="modalNextBtn" style="width: 100%; margin-top: 1.2rem;">Continue Unsealing 💥</button>
    </div>
  </div>

  <script>
    const poolData = {
      celebrities: [
        "911", "Alex Jones", "Alex Scott", "Alice Roberts", "Amanda Holden", "Andrea McLean",
        "Angelica Bell", "Anita Rani", "Anna Kendrick", "Ashley Jensen", "Atomic Kitten", "Becky Hill",
        "Big Bang Theory", "Cariad Lloyd", "Carol Vorderman", "Caroline Flack", "Charlotte Church", "Cherry Healey",
        "Christine Bleakley", "Clair Buckley", "Claire Sweeney", "Coronation Street", "Davina McCall", "EastEnders",
        "Ellie Taylor", "Emma Willis", "Emmerdale", "FBI", "Fern Brady", "Frankie Bridge",
        "Gemma Atkinson", "Girls Aloud", "Gladiators", "Groups", "Hannah Waddingham", "Helen Skelton",
        "Holly Willoughby", "Hospital Dramas", "Jac Jossa", "Jamie-Lee O'Donnell", "Jenna Coleman", "Jenny Falconer",
        "Jill Halfpenny", "Jorgie Porter", "Josie Gibson", "Kate Bottley (Rev)", "Kate Quilton", "Kate Ritchie",
        "Katy Hill", "Konnie Huq", "Laura Woods", "Lisa Snowdon", "Little Mix", "Lorraine Kelly",
        "Louise Redknapp", "Lucy Beaumont", "Lucy Porter", "Megan McCubbin", "Melanie Sykes", "Michaela Strachan",
        "Michelle Ackerley", "Myleene Klass", "Nadiya Hussain", "Naomi Schiff", "Natalie Pinkham", "Natasia Demetriou",
        "NCIS", "News / Weather", "Rachael Riley", "Rebecca Atkinson", "Rebecca Ryan", "Rochelle Humes",
        "Rose Matafeo", "Rosie Ramsey", "Royals / Politicians", "S Club", "Sally Phillips", "Sam Quek",
        "Sara Pascoe", "Sarah Jayne Dunn", "Sheridan Smith", "Sophie Turner", "Spice Girls", "Stacey Dooley",
        "Stacey Solomon", "Steps", "Suzi Perry", "Victoria Coren Mitchell"
      ],
      categories: ["Body Part (Her)", "Clothing", "Myself", "Item / Prop"],
      sub_her_body: ["Boobs", "Face", "Glasses", "Legs", "Booty", "Pussy", "Feet", "Mouth", "Hair", "Hands"],
      sub_clothing: ["Bra", "Knickers", "Skirt", "Shirt", "Hijab", "Dress", "Heels", "Jeans", "Gloves", "Stockings"],
      sub_myself: ["Stomach", "Balls", "Chest", "Hand", "Face", "Feet"],
      sub_item: ["Waffle Blanket", "Kitchen Counter", "Mirror", "Sofa Cushion", "Car Bonnet", "Chair", "Phone Screen"],
      
      act_standard: ["Leave on", "Clean off", "Play with it", "Take pictures", "Taste it", "Share it"],
      act_glasses_mouth: ["Take pictures", "Taste it", "Swallow", "Share it"],
      act_hands: ["Taste it", "Share it", "Play with it", "Use as lube", "Rub in face", "Put in ass"],

      methods: ["Blowjob", "Hand job", "Paired (Hand & Mouth)", "Pick a Hand Technique", "Slow vs Speed", "Toy Assisted"],
      
      climax: [
        "She's trying to break it off",
        "No stopping till every drop is out",
        "Edge 3 times before release",
        "Ruined hands off",
        "Slow motion only",
        "Denial trap. Stop for 30 seconds before continuing",
        "Mrs takes control (stop/go/fast/slow etc)",
        "Cock and ball torture"
      ]
    };

    class SoundFX {
      constructor() {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      }
      playRoll() {
        if (this.ctx.state === 'suspended') this.ctx.resume();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(220, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(80, this.ctx.currentTime + 0.06);
        gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.06);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.06);
      }
      playExplode() {
        if (this.ctx.state === 'suspended') this.ctx.resume();
        [150, 300, 500, 800].forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.05);
          gain.gain.setValueAtTime(0.2, this.ctx.currentTime + idx * 0.05);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.05 + 0.35);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(this.ctx.currentTime + idx * 0.05);
          osc.stop(this.ctx.currentTime + idx * 0.05 + 0.35);
        });
      }
    }

    const sfx = new SoundFX();

    const container = document.getElementById('webgl-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x07040a, 0.03);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 4, 11);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
    scene.add(ambientLight);

    const pointLight1 = new THREE.PointLight(0xf3c653, 2, 25);
    pointLight1.position.set(0, 6, 3);
    scene.add(pointLight1);

    const pointLight2 = new THREE.PointLight(0xff2a6d, 2, 30);
    pointLight2.position.set(-6, -2, -2);
    scene.add(pointLight2);

    const boxConfigs = [
      { name: "Velvet", color: 0xff2a6d },
      { name: "Gold", color: 0xf3c653 },
      { name: "Emerald", color: 0x10b981 },
      { name: "Midnight", color: 0x3b82f6 },
      { name: "Amethyst", color: 0xa855f7 }
    ];

    const boxMeshes = [];
    const boxSpacing = 2.4;
    const startX = -((boxConfigs.length - 1) * boxSpacing) / 2;

    boxConfigs.forEach((cfg, idx) => {
      const geometry = new THREE.BoxGeometry(1.6, 1.8, 1.6);
      const material = new THREE.MeshStandardMaterial({
        color: cfg.color,
        roughness: 0.25,
        metalness: 0.7,
        emissive: cfg.color,
        emissiveIntensity: 0.15
      });
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.set(startX + idx * boxSpacing, -0.6, 0);
      mesh.userData = { id: idx, name: cfg.name, assignedValue: null, originalColor: cfg.color, opened: false };
      scene.add(mesh);
      boxMeshes.push(mesh);
    });

    function createDiceFaceTexture(value) {
      const canvas = document.createElement('canvas');
      canvas.width = 256; canvas.height = 256;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#f8f5e6';
      ctx.fillRect(0, 0, 256, 256);

      ctx.lineWidth = 12;
      ctx.strokeStyle = '#d4cbb3';
      ctx.strokeRect(6, 6, 244, 244);

      ctx.fillStyle = '#1a1a1a';
      const drawDot = (x, y) => {
        ctx.beginPath();
        ctx.arc(x, y, 20, 0, Math.PI * 2);
        ctx.fill();
      };

      const p = 64, c = 128, f = 192;
      if (value === 1) { drawDot(c, c); }
      else if (value === 2) { drawDot(p, p); drawDot(f, f); }
      else if (value === 3) { drawDot(p, p); drawDot(c, c); drawDot(f, f); }
      else if (value === 4) { drawDot(p, p); drawDot(f, p); drawDot(p, f); drawDot(f, f); }
      else if (value === 5) { drawDot(p, p); drawDot(f, p); drawDot(c, c); drawDot(p, f); drawDot(f, f); }
      else if (value === 6) { drawDot(p, p); drawDot(f, p); drawDot(p, c); drawDot(f, c); drawDot(p, f); drawDot(f, f); }

      return new THREE.CanvasTexture(canvas);
    }

    const diceMaterials = [
      new THREE.MeshStandardMaterial({ map: createDiceFaceTexture(1), roughness: 0.2 }),
      new THREE.MeshStandardMaterial({ map: createDiceFaceTexture(6), roughness: 0.2 }),
      new THREE.MeshStandardMaterial({ map: createDiceFaceTexture(2), roughness: 0.2 }),
      new THREE.MeshStandardMaterial({ map: createDiceFaceTexture(5), roughness: 0.2 }),
      new THREE.MeshStandardMaterial({ map: createDiceFaceTexture(3), roughness: 0.2 }),
      new THREE.MeshStandardMaterial({ map: createDiceFaceTexture(4), roughness: 0.2 })
    ];

    const diceGeo = new THREE.BoxGeometry(1.4, 1.4, 1.4);
    const diceMesh = new THREE.Mesh(diceGeo, diceMaterials);
    diceMesh.position.set(0, 2.5, 2);
    scene.add(diceMesh);

    const faceRotations = {
      1: { x: 0, y: -Math.PI / 2 },
      2: { x: -Math.PI / 2, y: 0 },
      3: { x: 0, y: 0 },
      4: { x: Math.PI, y: 0 },
      5: { x: Math.PI / 2, y: 0 },
      6: { x: 0, y: Math.PI / 2 }
    };

    let shards = [];
    function explodeBoxMesh(mesh) {
      mesh.visible = false;
      const count = 45;
      const geom = new THREE.TetrahedronGeometry(0.2);
      const mat = new THREE.MeshStandardMaterial({ color: mesh.userData.originalColor, roughness: 0.2, metalness: 0.8 });

      for (let i = 0; i < count; i++) {
        const shard = new THREE.Mesh(geom, mat);
        shard.position.copy(mesh.position);
        shard.userData = {
          vx: (Math.random() - 0.5) * 0.35,
          vy: Math.random() * 0.35 + 0.1,
          vz: (Math.random() - 0.5) * 0.35,
          rotX: Math.random() * 0.2,
          rotY: Math.random() * 0.2,
          life: 1.0
        };
        scene.add(shard);
        shards.push(shard);
      }
    }

    let currentRollValue = null;
    let placedCount = 0;
    let openedCount = 0;
    let masterBlueprint = [];
    let boxOutcomes = {};

    const instructionText = document.getElementById('instructionText');
    const rollActionArea = document.getElementById('rollActionArea');
    const placeActionArea = document.getElementById('placeActionArea');
    const unsealActionArea = document.getElementById('unsealActionArea');
    const interactiveUnboxArea = document.getElementById('interactiveUnboxArea');
    const currentRollValEl = document.getElementById('currentRollVal');
    const boxChoiceGrid = document.getElementById('boxChoiceGrid');
    const unboxChoiceGrid = document.getElementById('unboxChoiceGrid');

    document.getElementById('initGameBtn').addEventListener('click', () => {
      document.getElementById('startScreen').style.display = 'none';
      instructionText.innerText = "Roll 1 of 5";
    });

    document.getElementById('rollDiceBtn').addEventListener('click', () => {
      document.getElementById('rollDiceBtn').disabled = true;
      instructionText.innerText = "Rolling Ivory Dice...";

      let counter = 0;
      const rollInterval = setInterval(() => {
        sfx.playRoll();
        currentRollValue = Math.floor(Math.random() * 6) + 1;
        currentRollValEl.innerText = currentRollValue;

        diceMesh.rotation.x += 0.4;
        diceMesh.rotation.y += 0.5;
        diceMesh.position.y = 2.5 + Math.sin(counter) * 0.25;

        counter++;

        if (counter > 12) {
          clearInterval(rollInterval);
          diceMesh.position.y = 2.5;
          const rot = faceRotations[currentRollValue];
          diceMesh.rotation.set(rot.x, rot.y, 0);

          instructionText.innerText = "Roll locked! Choose the box:";
          rollActionArea.style.display = 'none';
          placeActionArea.style.display = 'block';
          renderBoxChoiceButtons();
        }
      }, 70);
    });

    function renderBoxChoiceButtons() {
      boxChoiceGrid.innerHTML = '';
      boxMeshes.forEach((mesh, idx) => {
        const btn = document.createElement('button');
        btn.className = 'box-choice-btn';
        const isFilled = mesh.userData.assignedValue !== null;
        btn.disabled = isFilled;
        btn.innerHTML = `<span>${mesh.userData.name}</span><span style="font-size:1rem; color:var(--accent-gold);">${isFilled ? '✓ Locked' : 'Empty'}</span>`;
        btn.onclick = () => assignRollToBox(idx);
        boxChoiceGrid.appendChild(btn);
      });
    }

    function assignRollToBox(boxIdx) {
      boxMeshes[boxIdx].userData.assignedValue = currentRollValue;
      placedCount++;

      boxMeshes[boxIdx].material.emissiveIntensity = 0.7;
      placeActionArea.style.display = 'none';

      if (placedCount < 5) {
        instructionText.innerText = `Roll ${placedCount + 1} of 5`;
        rollActionArea.style.display = 'block';
        document.getElementById('rollDiceBtn').disabled = false;
      } else {
        instructionText.innerText = "All Boxes Loaded! Ready to Unseal.";
        unsealActionArea.style.display = 'block';
      }
    }

    document.getElementById('unsealVaultBtn').addEventListener('click', () => {
      prepareOutcomes();
      unsealActionArea.style.display = 'none';
      instructionText.innerText = "She chooses which box to explode!";
      interactiveUnboxArea.style.display = 'block';
      renderUnboxChoiceButtons();
    });

    function prepareOutcomes() {
      const celebValDice = boxMeshes[0].userData.assignedValue;
      const catValDice = boxMeshes[1].userData.assignedValue;
      const actionValDice = boxMeshes[2].userData.assignedValue;
      const methodValDice = boxMeshes[3].userData.assignedValue;
      const climaxValDice = boxMeshes[4].userData.assignedValue;

      // Stage 1: Celebrity Pick (uses seed from dice roll)
      const celebIndex = ((celebValDice * 17) + 3) % poolData.celebrities.length;
      const celebText = poolData.celebrities[celebIndex];

      // Stage 2: Category & Target
      const cat = poolData.categories[(catValDice - 1) % poolData.categories.length];
      
      let targetPool = poolData.sub_her_body;
      let actPool = poolData.act_standard;

      if (cat.includes("Clothing")) targetPool = poolData.sub_clothing;
      else if (cat.includes("Myself")) targetPool = poolData.sub_myself;
      else if (cat.includes("Item")) targetPool = poolData.sub_item;

      let targetText = targetPool[(actionValDice - 1) % targetPool.length];

      if (cat.includes("Body Part")) {
        if (targetText === "Glasses" || targetText === "Mouth") actPool = poolData.act_glasses_mouth;
        else if (targetText === "Hands") actPool = poolData.act_hands;
      }

      const actionText = actPool[(methodValDice - 1) % actPool.length];
      const methodText = poolData.methods[(climaxValDice - 1) % poolData.methods.length];
      const climaxText = poolData.climax[(celebValDice - 1) % poolData.climax.length];

      masterBlueprint = [
        { title: "Stage 1: Celebrity Inspiration", val: celebText },
        { title: "Stage 2: Target Focus", val: `${cat} — ${targetText}` },
        { title: "Stage 3: Action", val: actionText },
        { title: "Stage 4: Method", val: methodText },
        { title: "Stage 5: Over The Edge", val: climaxText }
      ];

      boxMeshes.forEach((mesh, i) => {
        boxOutcomes[i] = masterBlueprint[i];
      });
    }

    function renderUnboxChoiceButtons() {
      unboxChoiceGrid.innerHTML = '';
      boxMeshes.forEach((mesh, idx) => {
        const btn = document.createElement('button');
        btn.className = 'box-choice-btn';
        btn.disabled = mesh.userData.opened;
        btn.innerHTML = `<span>${mesh.name}</span><span style="font-size:0.9rem; color:var(--accent-gold);">${mesh.userData.opened ? 'Opened' : 'Explode 💥'}</span>`;
        btn.onclick = () => triggerBoxUnbox(idx);
        unboxChoiceGrid.appendChild(btn);
      });
    }

    let activeBoxIndex = null;
    function triggerBoxUnbox(boxIdx) {
      activeBoxIndex = boxIdx;
      boxMeshes[boxIdx].userData.opened = true;
      openedCount++;

      sfx.playExplode();
      triggerParticles();
      triggerShake();
      explodeBoxMesh(boxMeshes[boxIdx]);

      const stageData = boxOutcomes[boxIdx];
      const boxObj = boxMeshes[boxIdx];

      document.getElementById('modalTitle').innerText = `${boxObj.name} Box Unsealed (Rolled: ${boxObj.userData.assignedValue})`;
      const containerEl = document.getElementById('modalContentContainer');
      containerEl.innerHTML = `<div class="modal-main-text">${stageData.val}</div>`;

      const nextBtn = document.getElementById('modalNextBtn');
      if (openedCount < 5) {
        document.getElementById('blueprintBox').style.display = 'none';
        nextBtn.innerText = "Choose Next Box ➔";
      } else {
        const bpRows = document.getElementById('blueprintRows');
        bpRows.innerHTML = '';
        masterBlueprint.forEach((d, i) => {
          bpRows.innerHTML += `<div class="blueprint-row">${i + 1}. ${d.title}: <span>${d.val}</span></div>`;
        });
        document.getElementById('blueprintBox').style.display = 'block';
        nextBtn.innerText = "Start New Session ↺";
      }

      document.getElementById('revealOverlay').classList.add('show');
    }

    document.getElementById('modalNextBtn').addEventListener('click', () => {
      document.getElementById('revealOverlay').classList.remove('show');
      if (openedCount >= 5) {
        location.reload();
      } else {
        interactiveUnboxArea.style.display = 'block';
        renderUnboxChoiceButtons();
      }
    });

    function triggerShake() {
      const card = document.getElementById('modalCard');
      card.classList.add('shake');
      setTimeout(() => card.classList.remove('shake'), 400);
    }

    const fxCanvas = document.getElementById('fx-canvas');
    const fxCtx = fxCanvas.getContext('2d');
    let particles = [];

    function resizeFx() { fxCanvas.width = window.innerWidth; fxCanvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeFx);
    resizeFx();

    function triggerParticles() {
      particles = [];
      const colors = ['#f3c653', '#ff2a6d', '#10b981', '#3b82f6', '#a855f7'];
      for (let i = 0; i < 110; i++) {
        particles.push({
          x: window.innerWidth / 2, y: window.innerHeight / 2,
          vx: (Math.random() - 0.5) * 22, vy: (Math.random() - 0.7) * 22,
          size: Math.random() * 9 + 4, color: colors[Math.floor(Math.random() * colors.length)], life: 1
        });
      }
      requestAnimationFrame(updateParticles);
    }

    function updateParticles() {
      fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
      particles.forEach(p => {
        p.x += p.vx; p.y += p.vy; p.vy += 0.35; p.life -= 0.015;
        fxCtx.fillStyle = p.color;
        fxCtx.globalAlpha = Math.max(p.life, 0);
        fxCtx.fillRect(p.x, p.y, p.size, p.size);
      });
      particles = particles.filter(p => p.life > 0);
      if (particles.length > 0) requestAnimationFrame(updateParticles);
    }

    let clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const time = clock.getElapsedTime();

      boxMeshes.forEach((mesh, i) => {
        if (mesh.visible) {
          mesh.position.y = -0.6 + Math.sin(time * 1.5 + i) * 0.12;
          mesh.rotation.y += 0.005;
        }
      });

      shards.forEach((s, idx) => {
        s.position.x += s.userData.vx;
        s.position.y += s.userData.vy;
        s.position.z += s.userData.vz;
        s.userData.vy -= 0.015;
        s.rotation.x += s.userData.rotX;
        s.rotation.y += s.userData.rotY;
        s.userData.life -= 0.02;
        s.scale.setScalar(Math.max(s.userData.life, 0.001));
        if (s.userData.life <= 0) {
          scene.remove(s);
          shards.splice(idx, 1);
        }
      });

      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
